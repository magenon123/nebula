<style>

<script>
'use strict';
/* EMBERCLAW: Molten Reforge — server-side game engine.
 * Pure functions: no I/O, RNG injected. The client only animates what this returns. */

const ROWS = 5, COLS = 6;
const SYM = { IRON:0, COPPER:1, SILVER:2, HAMMER:3, TONGS:4, BLADE:5, CROWN:6, WILD:7, SCATTER:8 };
const NAMES = ['Iron Shard','Copper Ingot','Silver Chain','Molten Hammer','Rune-Etched Tongs',
  'Dragonbone Blade','Crown of Cinders','Ember Core Sigil','Forgefire Gem'];
const LOW_MAX = SYM.SILVER;

/* paytable: multiplier of bet per cluster size bucket [5-7, 8-9, 10-12, 13+] */
const PAYTABLE = [
  [0.10, 0.25, 0.5, 1.5], [0.15, 0.3, 0.6, 1.75], [0.2, 0.4, 0.8, 2],
  [0.4, 1, 2.5, 6], [0.6, 1.5, 3.5, 9],
  [1.5, 4, 10, 25], [3, 8, 20, 50]
];
const bucket = n => (n >= 13 ? 3 : n >= 10 ? 2 : n >= 8 ? 1 : 0);

/* tunable math (see emberclaw-sim.js) */
const CFG = {
  weights: [11, 14, 13, 17, 18, 26, 29],   // refill + initial symbol weights
  bonusWeights: [10, 10, 10, 14, 18, 22, 22], // leaner table during The Reforging (heat persists, so wilds snowball)
  bonusFlatCap: 8,                        // in The Reforging the flat bonus stacks once per 3 heat, up to this many tiers
  scatterP: 0.01027,                      // per-cell scatter chance on the initial grid (~1 in 280)
  anteScatterP: 0.01319,                // ante: raised scatter weight (~1 in 140)
  payScale: 1.055,                        // global payout trim applied to every cluster win (RTP calibration)
  heatFlat: 0.75,                         // heat >= 3: every cluster pays this flat bonus (spec said 0.5x; raised while tuning RTP)
  maxWin: 9500,
  freeSpins: 10, retriggerSpins: 4, retriggerMin: 2, maxBonusSpins: 100, maxSteps: 60,
  buy: { standard: { cost: 100, heat: 0 }, preheated: { cost: 500, heat: 6 } },
  anteCost: 1.25
};

function cryptoRng() { const a = new Uint32Array(2); crypto.getRandomValues(a); return (a[0] * 2 ** 21 + (a[1] >>> 11)) / 2 ** 53; }

const newGrid = fill => Array.from({ length: ROWS }, () => Array(COLS).fill(fill));
const clone = g => g.map(r => r.slice());

function pickSymbol(rng, W = CFG.weights) {
  let t = 0; for (const w of W) t += w;
  let x = rng() * t;
  for (let i = 0; i < W.length; i++) { x -= W[i]; if (x < 0) return i; }
  return W.length - 1;
}

function initialGrid(rng, scatterP, W) {
  const g = newGrid(0);
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++)
    g[r][c] = rng() < scatterP ? SYM.SCATTER : pickSymbol(rng, W);
  return g;
}

/* cluster detection: orthogonal adjacency, wilds join every cluster they touch */
function findClusters(g, wm) {
  const out = [];
  for (let s = 0; s <= SYM.CROWN; s++) {
    const seen = newGrid(false);
    for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) {
      if (seen[r][c] || g[r][c] !== s) continue;       // start only from a real symbol
      const cells = [], st = [[r, c]]; seen[r][c] = true;
      let real = 0;
      while (st.length) {
        const [y, x] = st.pop(); cells.push([y, x]);
        if (g[y][x] === s) real++;
        for (const [dy, dx] of [[1,0],[-1,0],[0,1],[0,-1]]) {
          const ny = y + dy, nx = x + dx;
          if (ny < 0 || nx < 0 || ny >= ROWS || nx >= COLS || seen[ny][nx]) continue;
          const v = g[ny][nx];
          if (v === s || v === SYM.WILD) { seen[ny][nx] = true; st.push([ny, nx]); }
        }
      }
      if (cells.length >= 5 && real > 0) {
        let mult = 0, wilds = 0;   // multiple wilds in a cluster add their multipliers
        for (const [y, x] of cells) if (g[y][x] === SYM.WILD) { mult += wm[y][x]; wilds++; }
        if (!wilds) mult = 1;
        out.push({ symbol: s, size: cells.length, cells, wilds, wildMult: mult });
      }
    }
  }
  return out;
}

function reforge(g, wm, rng, mult = 1) {
  const cand = [];
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) if (g[r][c] <= LOW_MAX) cand.push([r, c]);
  if (!cand.length) return null;
  const [r, c] = cand[Math.floor(rng() * cand.length)];
  const was = g[r][c]; g[r][c] = SYM.WILD; wm[r][c] = mult;
  return { r, c, was, mult };
}

/* Heat thresholds on the 9-notch Core: 3 = passive flat bonus, 6 = reforge, 9 = detonation.
 * Each of reforge / detonation fires at most once per spin sequence (`fired`), even if bonus heat keeps climbing. */
function heatEvents(from, to, g, wm, rng, fired) {
  const ev = [];
  for (let h = from + 1; h <= to; h++) {
    const k = h % 9;
    if (k === 6 && !fired.reforge) {
      fired.reforge = true;
      const f = reforge(g, wm, rng); if (f) ev.push({ type: 'reforge', heat: h, cells: [f] });
    } else if (k === 0 && !fired.detonate) { fired.detonate = true; ev.push(detonate(g, wm, rng, h)); }
  }
  return ev;
}
function detonate(g, wm, rng, heat, forced = false) {
  const doubled = [];
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++)
    if (g[r][c] === SYM.WILD) { wm[r][c] *= 2; doubled.push({ r, c, mult: wm[r][c] }); }
  const f = reforge(g, wm, rng);
  return { type: 'detonate', heat, forced, doubled, cells: f ? [f] : [] };
}
const wildList = (g, wm) => {
  const o = [];
  for (let r = 0; r < ROWS; r++) for (let c = 0; c < COLS; c++) if (g[r][c] === SYM.WILD) o.push({ r, c, mult: wm[r][c] });
  return o;
};

/* One spin = initial grid + full cascade chain. heat0 is the Core heat carried in. */
function engineSpin(rng, { heat0 = 0, ante = false, forceDetonate = false, noScatter = false, inBonus = false, weights = CFG.weights } = {}) {
  let g = initialGrid(rng, noScatter ? 0 : ante ? CFG.anteScatterP : CFG.scatterP, weights);
  const wm = newGrid(1);
  const out = { initialGrid: clone(g), startHeat: heat0, openingEvents: [], cascadeSteps: [], totalPayout: 0, scatters: 0 };
  for (const row of g) for (const v of row) if (v === SYM.SCATTER) out.scatters++;

  let heat = heat0;
  // carried-in heat (pre-heated / persisted) already past thresholds on the fresh board
  const fired = { reforge: false, detonate: false };
  if (heat >= 6) out.openingEvents.push(...heatEvents(0, 6, g, wm, rng, fired));
  if (heat >= 9) out.openingEvents.push(...heatEvents(6, 9, g, wm, rng, fired));
  if (forceDetonate) { fired.detonate = true; out.openingEvents.push(detonate(g, wm, rng, heat, true)); }
  out.openingGrid = clone(g); out.openingWilds = wildList(g, wm);

  let total = 0;
  for (let step = 0; step < CFG.maxSteps; step++) {
    const clusters = findClusters(g, wm);
    if (!clusters.length) break;
    const tiers = heat < 3 ? 0 : inBonus ? Math.min(Math.floor(heat / 3), CFG.bonusFlatCap) : 1;
    let payout = 0, wildClusters = 0;
    const cleared = [], cl = [];
    for (const k of clusters) {
      const base = PAYTABLE[k.symbol][bucket(k.size)] + tiers * CFG.heatFlat;
      const pay = base * k.wildMult * CFG.payScale;
      payout += pay; if (k.wilds) wildClusters++;
      cl.push({ symbol: k.symbol, size: k.size, payout: pay, wildMult: k.wildMult, cells: k.cells.map(([r, c]) => ({ r, c })) });
      for (const [r, c] of k.cells) if (g[r][c] !== SYM.WILD && !cleared.some(q => q.r === r && q.c === c))
        cleared.push({ r, c, sym: g[r][c] });
    }
    if (total + payout >= CFG.maxWin) { payout = CFG.maxWin - total; out.capped = true; }
    total += payout;

    for (const q of cleared) g[q.r][q.c] = -1;
    const newCells = [];
    for (const q of cleared) { const s = pickSymbol(rng, weights); g[q.r][q.c] = s; newCells.push({ r: q.r, c: q.c, sym: s }); }

    const prev = heat; heat += 1 + wildClusters;
    const reforgeEvents = out.capped ? [] : heatEvents(prev, heat, g, wm, rng, fired);
    out.cascadeSteps.push({
      clusters: cl, clearedCells: cleared, payout, newCells, coreHeat: heat, reforgeEvents,
      wilds: wildList(g, wm), grid: clone(g)
    });
    if (out.capped) break;
  }
  out.totalPayout = total; out.endHeat = heat;
  return out;
}

/* Full round: base spin (+ whole bonus if triggered). Payouts are in multiples of the base bet. */
function playRound(rng, { ante = false, buy = null } = {}) {
  const bonusFrom = (startHeat) => {
    const spins = []; let heat = startHeat, left = CFG.freeSpins, n = 0, total = 0, awarded = CFG.freeSpins;
    while (left > 0 && n < CFG.maxBonusSpins && total < CFG.maxWin) {
      n++; left--;
      const s = engineSpin(rng, { heat0: heat, forceDetonate: n % 3 === 0, weights: CFG.bonusWeights, inBonus: true });
      s.spinIndex = n; heat = s.endHeat; total += s.totalPayout;
      if (s.scatters >= CFG.retriggerMin) { left += CFG.retriggerSpins; awarded += CFG.retriggerSpins; s.retrigger = CFG.retriggerSpins; }
      s.spinsLeft = left;
      spins.push(s);
    }
    return { spins, totalPayout: Math.min(total, CFG.maxWin), freeSpinsAwarded: awarded, endHeat: heat };
  };

  if (buy) {
    const b = CFG.buy[buy];
    const bonus = bonusFrom(b.heat);
    return { cost: b.cost, initialGrid: null, cascadeSteps: [], baseSpin: null, bonus, bonusTriggered: true,
      freeSpinsAwarded: bonus.freeSpinsAwarded, totalPayout: bonus.totalPayout, bought: buy };
  }
  const base = engineSpin(rng, { ante });
  const trig = base.scatters >= 3;
  let bonus = null, total = base.totalPayout;
  if (trig) { bonus = bonusFrom(0); total = Math.min(CFG.maxWin, total + bonus.totalPayout); }
  return {
    cost: ante ? CFG.anteCost : 1,
    initialGrid: base.initialGrid, openingEvents: base.openingEvents, openingGrid: base.openingGrid,
    cascadeSteps: base.cascadeSteps, basePayout: base.totalPayout,
    totalPayout: total, bonusTriggered: trig, freeSpinsAwarded: trig ? bonus.freeSpinsAwarded : 0,
    bonus, capped: !!base.capped || total >= CFG.maxWin
  };
}

/* ---- STANDALONE MODE: the server engine is embedded and runs locally with play money. ---- */
const START_BALANCE = 1000;
let wallet = Number(localStorage.getItem('emberclawWallet') || START_BALANCE);
if (!(wallet >= 0.1)) wallet = START_BALANCE;
const _r2 = n => Math.round(n * 100) / 100;
async function api(body) {
  const stake = _r2(body.stake), buy = body.buy || null;
  const round = playRound(cryptoRng, { ante: !!body.ante, buy });
  const cost = _r2(stake * round.cost), payout = _r2(stake * round.totalPayout);
  if (cost > wallet + 1e-9) throw new Error('Not enough balance (reload page to reset play money)');
  wallet = _r2(wallet - cost + payout); localStorage.setItem('emberclawWallet', wallet);
  return { round, stake, cost, payout, user: { balance: wallet } };
}
/* Pure renderer: the server returns the whole cascade sequence; nothing here computes an outcome. */
const $ = id => document.getElementById(id);
const GLYPH = ['🔩','🪙','⛓️','🔨','🗜️','🗡️','👑','🔥','💎'];
const TIER = ['low','low','low','mid','mid','high','high','wild','scatter'];
const BETS = [0.1,0.2,0.5,1,2,5,10,20,50,100,200,500];
let bi = 3, ante = false, busy = false, balance = 0;
const sleep = ms => new Promise(r => setTimeout(r, ms));
const fmt = n => Number(n).toFixed(2);

const cells = [];
for (let i = 0; i < 30; i++) { const d = document.createElement('div'); d.className = 'cell'; $('grid').append(d); cells.push(d); }
const at = (r, c) => cells[r * 6 + c];
function paint(grid, wilds = []) {
  const wm = {}; wilds.forEach(w => wm[w.r * 6 + w.c] = w.mult);
  grid.forEach((row, r) => row.forEach((s, c) => {
    const d = at(r, c); d.className = 'cell t-' + TIER[s] + (s === 7 ? ' wild' : s === 8 ? ' scatter' : '');
    d.innerHTML = GLYPH[s] + (s === 7 && wm[r * 6 + c] > 1 ? `<span class="m">x${wm[r * 6 + c]}</span>` : '');
  }));
}
const tube = $('tube');
for (let i = 1; i <= 9; i++) { const e = document.createElement('i'); e.dataset.n = i; if (i % 3 === 0) e.classList.add('k' + i); tube.append(e); }
function setHeat(h) {
  const lit = Math.min(h, 9);
  [...tube.children].forEach(e => { const on = +e.dataset.n <= lit; e.classList.toggle('on', on); e.style.setProperty('--lvl', e.dataset.n); });
  $('heatNum').textContent = h; $('frame').style.setProperty('--heat', Math.min(h, 12));
}

/* hammer-strike sound */
let ac; function thump(f = 90, g = .5) {
  try { ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    const o = ac.createOscillator(), a = ac.createGain(); o.type = 'triangle'; o.frequency.setValueAtTime(f * 2, ac.currentTime);
    o.frequency.exponentialRampToValueAtTime(f, ac.currentTime + .12); a.gain.setValueAtTime(g, ac.currentTime);
    a.gain.exponentialRampToValueAtTime(.001, ac.currentTime + .35); o.connect(a).connect(ac.destination); o.start(); o.stop(ac.currentTime + .36); } catch {}
}

/* ember particles */
const cv = $('fx'), cx = cv.getContext('2d'); let parts = [];
function size() { cv.width = innerWidth; cv.height = innerHeight; } size(); addEventListener('resize', size);
function embers(n, x = innerWidth / 2, y = innerHeight / 2) {
  for (let i = 0; i < n; i++) parts.push({ x, y, vx: (Math.random() - .5) * 8, vy: -Math.random() * 7 - 1, l: 60 + Math.random() * 60, s: 1 + Math.random() * 3 });
}
(function loop() {
  cx.clearRect(0, 0, cv.width, cv.height);
  parts = parts.filter(p => p.l-- > 0);
  for (const p of parts) { p.x += p.vx; p.y += p.vy; p.vy += .12; cx.fillStyle = `rgba(255,${120 + p.l}, 20, ${p.l / 120})`; cx.fillRect(p.x, p.y, p.s, p.s); }
  requestAnimationFrame(loop);
})();
const shake = (big) => { const a = $('app'); a.classList.remove('shake', 'shake2'); void a.offsetWidth; a.classList.add(big ? 'shake2' : 'shake'); };
const say = t => $('msg').textContent = t;


async function playEvents(events) {
  for (const e of events || []) {
    if (e.type === 'detonate') { say(e.forced ? 'GUARANTEED DETONATION!' : 'CORE DETONATES — wilds x2!'); shake(true); thump(55, .8); embers(120); }
    else if (e.type === 'reforge') { say('The Core reforges a Wild!'); thump(70, .6); }
    for (const c of e.cells || []) { const d = at(c.r, c.c); d.classList.add('reforged'); }
    await sleep(700);
  }
}

/* step through one spin's cascade sequence; returns nothing, updates UI */
async function playSpin(sp, runningFrom, stake) {
  paint(sp.initialGrid); thump(80, .5); await sleep(450);
  if (sp.openingGrid) {
    if (sp.openingEvents && sp.openingEvents.length) { paint(sp.openingGrid, sp.openingWilds); await playEvents(sp.openingEvents); }
  }
  setHeat(sp.startHeat || 0);
  let run = runningFrom;
  for (const st of sp.cascadeSteps) {
    st.clusters.forEach(k => k.cells.forEach(c => at(c.r, c.c).classList.add('hit')));
    say(`Cluster x${st.clusters.length}  +${fmt(st.payout * stake)}`); thump(100, .4); await sleep(650);
    st.clearedCells.forEach(c => at(c.r, c.c).classList.add('shatter')); await sleep(330);
    run += st.payout * stake; $('win').textContent = fmt(run);
    paint(st.grid, st.wilds);
    st.newCells.forEach(c => at(c.r, c.c).classList.add('drop')); setHeat(st.coreHeat); embers(10, innerWidth / 2, innerHeight / 2);
    await sleep(450);
    await playEvents(st.reforgeEvents);
    if (st.reforgeEvents && st.reforgeEvents.length) paint(st.grid, st.wilds);
  }
  return run;
}

function tierOf(x) { return x >= 100 ? 'LEGENDARY' : x >= 25 ? 'FORGED' : x >= 10 ? 'MOLTEN' : x >= 5 ? 'SPARK' : null; }
async function bigWin(x, amt) {
  const t = tierOf(x); if (!t) return;
  const lv = { SPARK: 1, MOLTEN: 2, FORGED: 3, LEGENDARY: 4 }[t];
  $('bigT').textContent = t + ' WIN'; $('bigA').textContent = fmt(amt) + ' (' + x.toFixed(1) + 'x)';
  $('big').classList.add('show'); shake(lv > 2); embers(40 * lv * lv);
  for (let i = 0; i < lv; i++) { thump(60 + i * 10, .7); await sleep(300); embers(60 * lv); }
  await sleep(1400 + lv * 600); $('big').classList.remove('show');
}

async function go(buy) {
  if (busy) return; busy = true; document.querySelectorAll('button').forEach(b => b.disabled = true);
  $('win').textContent = '0.00'; $('fsBox').hidden = true;
  const stake = BETS[bi];
  try {
    setHeat(0);
    const j = await api({ stake, ante: buy ? false : ante, buy });
    const R = j.round; let run = 0;
    balance = j.user.balance - j.payout;  // show the stake leaving now, the win as it lands
    $('bal').textContent = fmt(balance);
    if (!R.bought) { run = await playSpin({ initialGrid: R.initialGrid, openingGrid: R.openingGrid, openingEvents: R.openingEvents, openingWilds: [], cascadeSteps: R.cascadeSteps, startHeat: 0 }, 0, stake); }
    if (R.bonusTriggered) {
      say(`THE REFORGING — ${R.freeSpinsAwarded} free spins!`); thump(50, .9); shake(true); embers(200); await sleep(1500);
      $('fsBox').hidden = false;
      for (const sp of R.bonus.spins) {
        $('fs').textContent = sp.spinsLeft; say(`Free spin ${sp.spinIndex}` + (sp.retrigger ? `  +${sp.retrigger} SPINS!` : ''));
        run = await playSpin(sp, run, stake); await sleep(300);
      }
      $('fsBox').hidden = true;
    }
    $('win').textContent = fmt(j.payout); balance = j.user.balance; $('bal').textContent = fmt(balance); syncParent(j.user);
    say(j.payout > 0 ? `You forged ${fmt(j.payout)}` : 'Cold iron. Strike again.');
    await bigWin(R.totalPayout, j.payout);
  } catch (e) { say(e.message); }
  busy = false; document.querySelectorAll('button').forEach(b => b.disabled = false); refreshUi();
}

function syncParent(u) { try { const a = parent !== window && parent._slotAPI; if (a) { a.bal = u.balance; a.paintBal(0); } } catch {} }
function refreshUi() {
  const s = BETS[bi]; $('bet').textContent = fmt(s);
  $('buy1').innerHTML = `BUY BONUS<br>${fmt(s * 100)}`; $('buy2').innerHTML = `PRE-HEATED<br>${fmt(s * 500)}`;
  $('ante').classList.toggle('on', ante); $('ante').innerHTML = ante ? `ANTE ON<br>${fmt(s * 1.25)}` : 'ANTE +25%';
}
$('m').onclick = () => { bi = Math.max(0, bi - 1); refreshUi(); };
$('p').onclick = () => { bi = Math.min(BETS.length - 1, bi + 1); refreshUi(); };
$('ante').onclick = () => { ante = !ante; refreshUi(); };
$('spin').onclick = () => go(null);
$('buy1').onclick = () => go('standard');
$('buy2').onclick = () => go('preheated');
addEventListener('keydown', e => { if (e.code === 'Space') { e.preventDefault(); go(null); } });

paint(Array.from({ length: 5 }, (_, r) => Array.from({ length: 6 }, (_, c) => (r * 2 + c) % 7)));
refreshUi();
balance = wallet; $('bal').textContent = fmt(balance);
</script></body></html>
