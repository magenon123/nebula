<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>Olympian Storm</title>
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Anton&display=swap" rel="stylesheet">
<style>
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden;background:#0d0620;
  font-family:Anton,Impact,'Arial Narrow Bold','Arial Black',sans-serif;color:#fff;user-select:none;-webkit-user-select:none}
button{font-family:inherit;cursor:pointer}
#game{position:absolute;left:0;top:0;transform-origin:0 0;overflow:hidden}
.box{position:absolute}
.nolay,.off{display:none!important}

/* backgrounds */
#bg,#bgFs{position:absolute;inset:0;transition:opacity .9s}
#bg{background:
  radial-gradient(40% 18% at 12% 88%,rgba(255,255,255,.75),transparent 70%),
  radial-gradient(45% 20% at 88% 92%,rgba(255,255,255,.7),transparent 70%),
  radial-gradient(35% 14% at 50% 97%,rgba(255,240,250,.8),transparent 70%),
  radial-gradient(30% 16% at 8% 30%,rgba(255,255,255,.55),transparent 70%),
  radial-gradient(28% 14% at 92% 12%,rgba(255,250,240,.6),transparent 70%),
  radial-gradient(70% 50% at 50% 0%,#fff1d6 0%,transparent 70%),
  linear-gradient(180deg,#f6d6c4 0%,#e7b9d3 35%,#bfa1e0 65%,#9a86d8 100%)}
#bgFs{opacity:0;background:
  radial-gradient(40% 18% at 12% 90%,rgba(190,140,255,.45),transparent 70%),
  radial-gradient(45% 20% at 88% 92%,rgba(190,140,255,.4),transparent 70%),
  radial-gradient(60% 40% at 50% 40%,#7e30d9 0%,transparent 75%),
  linear-gradient(180deg,#3a0f7a 0%,#5b1aa8 45%,#3b0c78 100%)}
#bgFs::before{content:"";position:absolute;inset:0;opacity:.8;
  background-image:radial-gradient(2px 2px at 10% 20%,#fff,transparent),radial-gradient(2px 2px at 30% 70%,#fff,transparent),
  radial-gradient(1.5px 1.5px at 55% 15%,#fff,transparent),radial-gradient(2px 2px at 80% 40%,#fff,transparent),
  radial-gradient(1.5px 1.5px at 90% 80%,#fff,transparent),radial-gradient(2px 2px at 70% 90%,#fff,transparent),
  radial-gradient(1.5px 1.5px at 20% 50%,#fff,transparent),radial-gradient(1.5px 1.5px at 45% 85%,#fff,transparent)}
#temple{position:absolute;right:0;top:0;width:560px;height:1080px;opacity:.55}
.port #temple{display:none}

/* text styles */
.gold{background:linear-gradient(180deg,#fffbd6 0%,#ffe066 38%,#e0a21a 52%,#b36b00 62%,#ffd966 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-stroke:2px #4d2a00;
  filter:drop-shadow(0 3px 0 rgba(40,15,0,.7))}
.blue{background:linear-gradient(180deg,#eefaff 0%,#8fd3ff 45%,#2e7fe6 60%,#9fe0ff 100%);
  -webkit-background-clip:text;background-clip:text;color:transparent;-webkit-text-stroke:1.5px #0a1a4f;
  filter:drop-shadow(0 3px 0 rgba(0,0,30,.6))}
.whiteT{color:#fff;filter:drop-shadow(0 3px 0 rgba(0,0,0,.55))}

/* top line / tumble plaque */
#top{display:flex;align-items:center;justify-content:center;text-align:center}
#topText{font-size:54px;letter-spacing:1px;white-space:nowrap}
#tumble{position:absolute;left:120px;right:120px;top:0;bottom:0;border-radius:0 0 18px 18px;
  background:linear-gradient(#6b1c14,#3d0d08);border:4px solid #e3b43c;border-top:none;
  box-shadow:0 0 0 3px #6b4300,inset 0 0 18px rgba(0,0,0,.7),0 6px 16px rgba(0,0,0,.4);
  display:flex;flex-direction:column;align-items:center;justify-content:center;line-height:1}
#tumble .tl{font-size:28px}
#tumbleAmt{font-size:42px;margin-top:2px;white-space:nowrap}

/* frame + grid */
#frame{padding:16px;border-radius:10px;
  background:linear-gradient(135deg,#fff3a6 0%,#d9a520 22%,#8a5a00 45%,#f7d774 62%,#b07800 80%,#ffe38a 100%);
  box-shadow:0 0 0 3px #5c3a00,0 14px 40px rgba(40,0,60,.55)}
#frame::before,#frame::after{content:"";position:absolute;top:-26px;width:90px;height:60px;
  background:linear-gradient(135deg,#fff3a6,#d9a520 40%,#8a5a00 70%,#f7d774);clip-path:polygon(0 100%,20% 0,45% 55%,100% 60%,40% 100%)}
#frame::before{left:-22px}#frame::after{right:-22px;transform:scaleX(-1)}
#grid{position:relative;width:100%;height:100%;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));grid-template-rows:repeat(5,minmax(0,1fr));
  border-radius:4px;overflow:hidden;background:
  linear-gradient(90deg,rgba(0,0,0,.25) 0,transparent 8%,transparent 92%,rgba(0,0,0,.25) 100%),
  linear-gradient(180deg,#8a2418,#6a1a10 50%,#521209);box-shadow:inset 0 0 40px rgba(0,0,0,.6)}
.cell{position:relative;min-width:0;min-height:0;display:flex;align-items:center;justify-content:center;border-left:3px solid rgba(40,6,2,.5)}
.cell:nth-child(6n+1){border-left:none}
.cell svg{height:90%;width:auto;max-width:96%;aspect-ratio:1;overflow:visible;filter:drop-shadow(0 5px 3px rgba(0,0,0,.45))}
.cell.new{animation:drop .38s cubic-bezier(.35,1.25,.55,1) both}
@keyframes drop{from{transform:translateY(-140%);opacity:0}60%{opacity:1}to{transform:none;opacity:1}}
.cell.hit{background:rgba(110,220,255,.14);box-shadow:inset 0 0 0 3px #aef6ff,inset 0 0 22px #36c8ff,0 0 16px #36c8ff;z-index:2}
.cell.hit svg{animation:hitG .45s ease-in-out infinite alternate}
@keyframes hitG{from{transform:scale(1)}to{transform:scale(1.08);filter:drop-shadow(0 0 14px #bff6ff) brightness(1.15)}}
.cell.pop svg{transform:scale(1.35);opacity:0;transition:transform .22s,opacity .22s}
.cell.glow svg{animation:glowP .5s ease-in-out infinite alternate}
@keyframes glowP{from{filter:drop-shadow(0 0 4px #fff6b0)}to{filter:drop-shadow(0 0 22px #ffe066) brightness(1.25);transform:scale(1.1)}}
.cell.dim{filter:brightness(.4) saturate(.7)}
.amt{position:absolute;left:50%;top:50%;transform:translate(-50%,-50%);z-index:5;font-size:64px;white-space:nowrap;
  color:#f3e8ff;-webkit-text-stroke:2px #3b0a6b;filter:drop-shadow(0 4px 2px rgba(0,0,0,.5));pointer-events:none;
  animation:amtIn .3s ease-out}
@keyframes amtIn{from{transform:translate(-50%,-50%) scale(.4);opacity:0}}
.port .amt{font-size:52px}

/* left panels */
.plq{border-radius:14px;background:linear-gradient(#2f357c,#161a52);border:5px solid #e3b43c;
  box-shadow:0 0 0 3px #6b4300,inset 0 0 0 2px #fbe39a,inset 0 0 26px rgba(0,0,0,.7),0 8px 18px rgba(0,0,0,.35)}
.btnp{cursor:pointer;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;line-height:1;transition:transform .12s,filter .2s}
.btnp:hover{transform:scale(1.03)}
.btnp .t1{font-size:40px}.btnp .t2{font-size:30px;margin-top:2px}.btnp .t2.sm{font-size:24px}.btnp .t3{font-size:46px;margin-top:6px}
.btnp .fa{display:none;font-size:44px;line-height:1.05}
.btnp.act>:not(.fa){display:none}.btnp.act .fa{display:block}
.btnp.act,.btnp.dis{filter:saturate(.35) brightness(.75);cursor:default;transform:none}
.parch{border-radius:12px;background:linear-gradient(180deg,#fbf2d8,#ecdcae 60%,#dcc48a);border:5px solid #e3b43c;
  box-shadow:0 0 0 3px #6b4300,inset 0 0 20px rgba(120,80,0,.35),0 8px 18px rgba(0,0,0,.35);
  display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;line-height:1.02;color:#1d2a6b}
.parch .a1{font-size:44px}.parch .a2{font-size:48px}.parch .a3{font-size:26px;margin:4px 8px 10px;color:#1d2a6b}
.parch .a1,.parch .a3{-webkit-text-stroke:1px #fff;filter:drop-shadow(0 2px 0 rgba(255,255,255,.6))}
.tog{display:flex;align-items:center;gap:8px;background:#2c2c2c;border-radius:6px;padding:3px 14px 3px 3px;cursor:pointer;border:2px solid #0d0d0d}
.tog .arr{background:linear-gradient(#5ee05e,#1e8c1e);color:#fff;border-radius:4px;width:44px;height:30px;display:flex;align-items:center;justify-content:center;font-size:22px}
.tog b{font-size:24px;color:#fff;font-weight:400;min-width:40px}
.tog.on{background:#1f5e1f}.tog.on .arr{background:linear-gradient(#fff38a,#e0a21a);color:#4d2a00}
.dark{background:linear-gradient(#34101a,#1c060c);border-radius:12px;padding:8px;display:flex;flex-direction:column;justify-content:flex-end;overflow:hidden}
#list{display:flex;flex-direction:column;gap:6px}
.le{display:flex;align-items:center;justify-content:space-between;background:linear-gradient(#4a4750,#2e2b33);border-radius:6px;
  padding:4px 12px;font-size:30px;animation:amtIn .25s}
.le span{display:flex;align-items:center;gap:6px}.le svg{width:34px;height:34px}
.port #list{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}.port .le{font-size:26px}

/* free spins column */
#multBox{display:flex;flex-direction:column;align-items:center}
#multBox .ml{font-size:36px;text-align:center;line-height:1;margin-bottom:-6px;z-index:2}
#coin{position:relative;width:250px;height:160px;z-index:2}
#coin svg{width:100%;height:100%}
#coinTxt{position:absolute;left:0;right:0;top:50%;transform:translateY(-52%);text-align:center;font-size:66px;line-height:1}
#coin.bump{animation:bump .5s}
@keyframes bump{40%{transform:scale(1.18);filter:brightness(1.4) drop-shadow(0 0 20px #ffe066)}}
#pillar{flex:1;width:190px;margin-top:-26px}
.port #pillar{display:none}
.port #coin{width:230px;height:140px}.port #multBox .ml{font-size:32px}
#fsLeftBox{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;line-height:1}
#fsLeftBox .l1{font-size:34px}#fsLeft{font-size:62px;margin-top:4px}

/* right side */
#logo svg,#zeus svg{width:100%;height:100%;overflow:visible}
#zArm{transform-origin:208px 160px;transition:transform .25s}
#zeus.raise #zArm{transform:rotate(-155deg)}
#zeus{animation:float 4s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-10px)}}

/* bottom bar */
#credit{display:flex;flex-direction:column;justify-content:center;gap:2px;font-size:36px;line-height:1.05;white-space:nowrap}
#credit .gl{display:inline-block;min-width:118px;text-align:right;margin-right:12px}
.gl{background:linear-gradient(180deg,#fff6b0,#f5c21a 55%,#c07a0c);-webkit-background-clip:text;background-clip:text;color:transparent;
  -webkit-text-stroke:1px #4d2a00;font-style:italic}
#winBox{display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;line-height:1.05}
#winLine{font-size:76px;white-space:nowrap;display:flex;align-items:baseline;gap:18px}
#winLine .gl{font-style:normal;-webkit-text-stroke:2px #4d2a00}
#winV{color:#fff;filter:drop-shadow(0 4px 0 rgba(0,0,0,.5))}
#msg{font-size:36px;white-space:nowrap;display:flex;align-items:center;gap:10px;filter:drop-shadow(0 3px 0 rgba(0,0,0,.55))}
#msg svg{width:44px;height:44px}
.circ{border-radius:50%;background:rgba(10,4,30,.25);border:4px solid rgba(255,255,255,.75);color:#fff;font-size:46px;line-height:1;
  display:flex;align-items:center;justify-content:center;padding:0 0 4px}
.circ:disabled{opacity:.35;cursor:default}
#spinBtn{border-radius:50%;background:radial-gradient(circle,rgba(30,10,60,.35),rgba(10,4,30,.55));border:6px solid #fff;
  box-shadow:0 0 18px rgba(0,0,0,.4);display:flex;align-items:center;justify-content:center;padding:0}
#spinBtn svg{width:70%;height:70%;transition:transform .4s}
#spinBtn:hover svg{transform:rotate(90deg)}
#spinBtn .stop{display:none;width:44%;height:44%;border:6px solid #ff4d5a;border-radius:10px;background:rgba(255,77,90,.15)}
#spinBtn.busy svg{display:none}#spinBtn.busy .stop{display:block}
#autoBox{display:flex;border-radius:28px;overflow:hidden;border:3px solid #fff;background:rgba(10,4,30,.55)}
#autoBox button{border:none;background:none;color:#fff;font-size:26px;letter-spacing:1px}
#turboBtn{width:56px;border-right:2px solid rgba(255,255,255,.5)!important;font-size:30px!important}
#turboBtn.on{color:#ffd23f;text-shadow:0 0 10px #ffd23f}
#autoBtn{flex:1}#autoBtn.on{color:#5dff7a;text-shadow:0 0 10px #5dff7a}
#sys{display:flex;flex-direction:column;gap:14px;align-items:center}
#sys button{width:60px;height:60px;border-radius:50%;border:3px solid rgba(255,255,255,.85);background:rgba(10,4,30,.45);color:#fff;font-size:34px;
  display:flex;align-items:center;justify-content:center;padding:0;font-family:Georgia,serif;font-style:italic;font-weight:700}
#menuBtn{font-family:Anton,sans-serif!important;font-style:normal!important;font-weight:400!important}

/* effects + overlays */
#fx{position:absolute;inset:0;pointer-events:none;z-index:40}
.fly{position:absolute;transition:transform .65s cubic-bezier(.5,0,.4,1),opacity .65s;z-index:41}
.fly svg{width:100%;height:100%;overflow:visible}
.bolt{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;animation:boltF .45s ease-out forwards}
@keyframes boltF{0%{opacity:1}100%{opacity:0}}
#ov{position:absolute;inset:0;z-index:60;background:rgba(15,0,35,.62);display:flex;align-items:center;justify-content:center;animation:fadeIn .25s}
@keyframes fadeIn{from{opacity:0}}
.stone{position:relative;border:10px solid #e3b43c;border-radius:6px;
  box-shadow:0 0 0 4px #6b4300,inset 0 0 0 3px #fbe39a,inset 0 0 60px rgba(0,0,0,.8),0 20px 60px rgba(0,0,0,.6);
  background:radial-gradient(circle at 50% 50%,#3a3a3a,#1f1f22 70%),#26262a;
  display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;animation:plIn .35s cubic-bezier(.3,1.4,.6,1)}
@keyframes plIn{from{transform:scale(.6);opacity:0}}
.stone .h{font-size:92px;line-height:1.05}
.stone .p{font-size:110px;line-height:1.1}
.okx{display:flex;gap:210px;margin-top:40px}
.okx button{width:150px;height:120px;border-radius:12px;border:4px solid #e3b43c;background:linear-gradient(#aef0ee,#46b8b6 60%,#2f8f8d);
  box-shadow:inset 0 0 18px rgba(0,60,60,.6),0 6px 0 #1d5c5b;font-size:90px;line-height:1;display:flex;align-items:center;justify-content:center}
.okx .no{color:#e52222;-webkit-text-stroke:2px #fff}.okx .yes{color:#6fe01e;-webkit-text-stroke:2px #1f4d00}
.congr{position:relative;width:1560px;height:860px;animation:plIn .4s cubic-bezier(.3,1.4,.6,1)}
.congr>svg{position:absolute;inset:0;width:100%;height:100%;overflow:visible}
.congr .in{position:absolute;left:0;right:0;top:400px;display:flex;flex-direction:column;align-items:center;line-height:1}
.congr .won{font-size:72px}
.congr .bar{margin:26px 0;min-width:720px;padding:14px 60px;border-radius:14px;border:5px solid #e3b43c;
  background:linear-gradient(#6d5cf0,#3a22b8 55%,#2a1690);box-shadow:inset 0 0 18px rgba(0,0,0,.45),0 0 0 3px #6b4300;
  font-size:118px;text-align:center}
.congr .sub{font-size:74px}
.congr .note{font-size:40px;margin-top:14px}
.congr .cont{position:absolute;left:0;right:0;bottom:22px;text-align:center;font-family:Arial,sans-serif;font-size:30px;letter-spacing:1px;color:#fff}
.port .congr{transform:scale(.66)}
.port .stone{transform:scale(.8)}
.bigwin{text-align:center;animation:plIn .4s cubic-bezier(.3,1.4,.6,1)}
.bigwin .bw{font-size:190px;line-height:1}.bigwin .bv{font-size:120px;color:#fff;filter:drop-shadow(0 6px 0 rgba(0,0,0,.5))}
.port .bigwin .bw{font-size:140px}.port .bigwin .bv{font-size:96px}
.scroll{width:1180px;max-height:860px;padding:30px 44px;justify-content:flex-start;overflow:auto;text-align:left;
  font-family:Arial,sans-serif;font-size:26px;line-height:1.45;color:#eee}
.port .scroll{width:1000px;max-height:1600px;transform:none}
.scroll h3{font-family:Anton,Impact,sans-serif;font-weight:400;font-size:48px;margin:6px 0 10px;letter-spacing:1px}
.scroll table{border-collapse:collapse;margin:0 auto 10px;font-size:30px}
.scroll td,.scroll th{padding:4px 22px;text-align:center}
.scroll th{font-family:Anton,Impact,sans-serif;font-weight:400;color:#fde68a}
.orbrow{display:flex;flex-wrap:wrap;justify-content:center;gap:4px 6px;margin:4px 0 12px}.orbrow span{width:92px;height:92px}.orbrow svg{width:100%;height:100%;overflow:visible}
.scroll .ic{display:inline-block;width:70px;height:70px;vertical-align:middle}.scroll .ic svg{width:100%;height:100%}
.scroll .sm{display:inline-block;width:40px;height:40px;vertical-align:middle}.scroll .sm svg{width:100%;height:100%}
.pwrap{position:relative;display:flex;flex-direction:column;align-items:center;gap:22px}
.xbtn{position:absolute;right:-34px;top:-34px;z-index:3;width:84px;height:84px;border-radius:50%;border:5px solid #e3b43c;
  background:linear-gradient(#c62828,#7a0f0f);color:#fff;font-size:52px;line-height:1;display:flex;align-items:center;justify-content:center;
  box-shadow:0 0 0 3px #6b4300,0 6px 14px rgba(0,0,0,.5);padding:0 0 6px}
.closeBig{font-size:40px;letter-spacing:2px;padding:10px 70px;border-radius:12px;border:4px solid #e3b43c;color:#fff;
  background:linear-gradient(#aef0ee,#46b8b6 60%,#2f8f8d);text-shadow:0 2px 0 #1d5c5b;box-shadow:0 6px 0 #1d5c5b}
.setrow{display:flex;justify-content:space-between;align-items:center;gap:30px;font-family:Anton,sans-serif;font-size:40px;margin:14px 0}
.setrow button{font-size:30px;padding:8px 24px;border-radius:10px;border:3px solid #e3b43c;background:#2f357c;color:#fff}
#pop{position:absolute;left:50%;top:44%;transform:translate(-50%,-50%);z-index:70;background:rgba(160,20,40,.92);border:3px solid #ffb4b4;
  padding:18px 40px;border-radius:14px;font-size:44px;opacity:0;transition:opacity .2s;pointer-events:none;white-space:nowrap}
#pop.on{opacity:1}
</style></head><body>
<div id="game" class="land">
  <div id="bg"></div><div id="bgFs"></div>
  <svg id="temple" viewBox="0 0 560 1080" preserveAspectRatio="xMaxYMin slice">
    <defs><linearGradient id="tpl" x1="0" x2="0" y1="0" y2="1"><stop offset="0" stop-color="#fff8ee"/><stop offset="1" stop-color="#e4cfe6"/></linearGradient></defs>
    <path d="M120 150 L360 60 L600 150Z" fill="url(#tpl)" stroke="#d8bcd8" stroke-width="3"/>
    <rect x="120" y="150" width="480" height="30" fill="url(#tpl)" stroke="#d8bcd8" stroke-width="3"/>
    <g fill="url(#tpl)" stroke="#d8bcd8" stroke-width="3">
      <rect x="150" y="180" width="44" height="480"/><rect x="250" y="180" width="44" height="480"/><rect x="350" y="180" width="44" height="480"/><rect x="450" y="180" width="44" height="480"/></g>
    <g fill="#e9d8ea"><rect x="100" y="660" width="520" height="24"/><rect x="80" y="684" width="560" height="24"/><rect x="60" y="708" width="600" height="24"/></g>
  </svg>

  <div class="box" id="top"><div id="topText" class="gold">WIN UP TO 50,000× BET</div>
    <div id="tumble" hidden><div class="tl gold">TUMBLE WIN</div><div id="tumbleAmt" class="gold">$0.00</div></div></div>
  <div class="box" id="logo"></div>
  <div class="box" id="zeus"></div>

  <div class="box plq btnp" id="buyBox"><div class="t1 blue">BUY</div><div class="t2 blue">FREE SPINS</div><div class="t3 gold" id="buyPrice">$200.00</div><div class="fa blue">FEATURE<br>ACTIVE</div></div>
  <div class="box plq btnp" id="sbuyBox"><div class="t1 blue">BUY</div><div class="t2 sm blue">SUPER FREE SPINS</div><div class="t3 gold" id="sbuyPrice">$1,000.00</div><div class="fa blue">FEATURE<br>ACTIVE</div></div>
  <div class="box parch" id="anteBox"><div class="a1">BET</div><div class="a2 gold" id="antePrice">$3.00</div><div class="a3">DOUBLE CHANCE TO WIN FEATURE</div>
    <div class="tog" id="anteTog"><span class="arr">&#10140;</span><b id="anteTxt">OFF</b></div></div>
  <div class="box" id="multBox"><div class="ml gold">TOTAL<br>MULTIPLIER</div><div id="coin"></div><svg id="pillar" viewBox="0 0 200 400" preserveAspectRatio="none"></svg></div>
  <div class="box plq" id="fsLeftBox"><div class="l1 gold">FREE SPINS<br>LEFT</div><div id="fsLeft" class="blue">15</div></div>
  <div class="box dark" id="listBox"><div id="list"></div></div>

  <div class="box" id="frame"><div id="grid"></div></div>

  <div class="box" id="sys"><button id="menuBtn" title="Settings">&#8801;</button><button id="infoBtn" title="Paytable and rules">i</button></div>

/* ================= OLYMPIAN STORM engine (pure: takes an rng, returns the whole round) ================= */
const OLY=(function(){
  const COLS=6,ROWS=5,MAXWIN=50000;
  // pays in multiples of the base bet for 8-9 / 10-11 / 12-30 of a symbol anywhere
  const PAY={crown:[10,25,50],hourglass:[2.5,10,25],ring:[2,5,15],chalice:[1.5,2,12],
    red:[1,1.5,10],purple:[0.8,1.2,8],yellow:[0.5,1,5],green:[0.4,0.9,4],blue:[0.25,0.75,2]};
  const WGT={crown:10,hourglass:11.3,ring:12.77,chalice:14.43,red:16.3,purple:18.42,yellow:20.82,green:23.53,blue:26.58};
  const SCAT_PAY={4:3,5:5,6:100};                 // 6 or more pays 100x
  const SUPER_PAY=[0,100,500,5000,50000];          // by super scatters in the trigger
  const ORBS=[2,3,4,5,6,8,10,12,15,20,25,50,100,250,500];
  const ORBW=[30,22,17,14,11,9,7,5,4,3,2.2,1,0.12,0.02,0.006];
  // per-cell odds for scatter, super scatter and multiplier orb, per mode
  const MODE={
    base:{S:0.0171,Z:0.00045,M:0.007,min:2,tilt:0.6765,cap:20,pw:1.0393},
    ante:{S:0.02327,Z:0.00043,M:0.007,min:2,tilt:0.6765,cap:20,pw:1.0393},
    fs:  {S:0.012,Z:0,M:0.021,min:2,tilt:-0.8,cap:20,pw:1.6042},      // super scatters never land in free spins
    sfs: {S:0.012,Z:0,M:0.021,min:10,tilt:0.3,cap:100,pw:1.652}      // super free spins: every orb is x10 or more
  };
  const SYMS=Object.keys(WGT);
  // pw>1 skews a mode's reels toward the common symbols, so wins connect more often 
  for(const k in MODE){const m=MODE[k]; m.sw=SYMS.map(s=>Math.pow(WGT[s],m.pw||1)); m.st=m.sw.reduce((a,b)=>a+b,0);}
  const tier=n=>n>=12?2:n>=10?1:n>=8?0:-1;

  // bonus modes lean the orb values upward: weight x min(value,cap)^tilt (normal free spins cap at 20 so 50x-500x stay rare), orbs below min never land
  for(const k in MODE){const m=MODE[k];
    m.ow=ORBS.map((v,i)=>v<m.min?0:ORBW[i]*Math.pow(Math.min(v,m.cap),m.tilt)); m.ot=m.ow.reduce((a,b)=>a+b,0)}
  function orb(R,m){
    let t=R()*m.ot;
    for(let i=0;i<ORBS.length;i++){ t-=m.ow[i]; if(t<0)return ORBS[i]; }
    return ORBS[ORBS.length-1];
  }
  function cell(R,m){
    const t=R();
    if(t<m.S)return 'S';
    if(t<m.S+m.Z)return 'Z';
    if(t<m.S+m.Z+m.M)return {m:orb(R,m)};
    let u=R()*m.st;
    for(let i=0;i<SYMS.length;i++){ u-=m.sw[i]; if(u<0)return SYMS[i]; }
    return 'blue';
  }
  const copy=g=>g.map(c=>c.slice());
  const key=c=>typeof c==='string'?c:'M';

  /* one spin with all its tumbles. grid is [col][row], row 0 at the top */
  function spin(R,modeName){
    const m=MODE[modeName];
    const g=Array.from({length:COLS},()=>Array.from({length:ROWS},()=>cell(R,m)));
    const steps=[{grid:copy(g),hits:[],wins:[],fresh:null}];
    let win=0;
    for(;;){
      const cnt={};
      for(let c=0;c<COLS;c++)for(let r=0;r<ROWS;r++){const k=key(g[c][r]);cnt[k]=(cnt[k]||0)+1}
      const wins=SYMS.filter(s=>cnt[s]&&tier(cnt[s])>=0).map(s=>({s,n:cnt[s],pay:PAY[s][tier(cnt[s])]}));
      if(!wins.length)break;
      const hit=new Set(wins.map(w=>w.s)), hits=[], fresh=[];
      wins.forEach(w=>win+=w.pay);
      for(let c=0;c<COLS;c++){
        const keep=[];
        for(let r=0;r<ROWS;r++){ if(hit.has(key(g[c][r])))hits.push([c,r]); else keep.push(g[c][r]); }
        const add=ROWS-keep.length;
        const col=[];
        for(let r=0;r<add;r++){ col.push(cell(R,m)); fresh.push([c,r]); }
        g[c]=col.concat(keep);
      }
      steps.push({grid:copy(g),hits,wins,fresh});
    }
    let orbSum=0,S=0,Z=0;
    for(let c=0;c<COLS;c++)for(let r=0;r<ROWS;r++){
      const v=g[c][r];
      if(v==='S')S++; else if(v==='Z')Z++; else if(typeof v==='object')orbSum+=v.m;
    }
    return {steps,win,orbSum,scat:S+Z,sup:Z};
  }

  /* a whole paid round: base spin (or a buy) plus any free spins, in units of the base bet */
  function play(R,opt){
    opt=opt||{};
    const spins=[]; let total=0, capped=false;
    const add=(sp,pay)=>{
      if(total+pay>=MAXWIN){ pay=MAXWIN-total; capped=true; }
      total+=pay; sp.pay=pay; spins.push(sp); return capped;
    };
    let fs=0, fsMode=null;
    if(opt.buy){
      fs=15; fsMode=opt.buy==='super'?'sfs':'fs';
    }else{
      const sp=spin(R,opt.ante?'ante':'base');
      let pay=sp.win>0&&sp.orbSum>0?sp.win*sp.orbSum:sp.win;
      sp.kind='base'; sp.mult=sp.win>0?sp.orbSum:0;
      if(sp.scat>=4){
        sp.scatPay=sp.sup?SUPER_PAY[Math.min(sp.sup,4)]:SCAT_PAY[Math.min(sp.scat,6)];
        pay+=sp.scatPay; fs=15; fsMode='fs'; sp.award=15;
      }
      if(add(sp,pay))return {spins,total,capped};
    }
    let fsMult=0, left=fs;
    while(left>0){
      const sp=spin(R,fsMode);
      sp.kind=fsMode; left--;
      if(sp.win>0&&sp.orbSum>0)fsMult+=sp.orbSum;
      let pay=sp.win*(sp.orbSum>0&&fsMult>0?fsMult:1);
      sp.mult=fsMult;
      if(sp.scat>=3){ left+=5; sp.award=5; }
      sp.left=left;
      if(add(sp,pay))break;
    }
    return {spins,total,capped,fs};
  }
  return {COLS,ROWS,MAXWIN,PAY,SCAT_PAY,SUPER_PAY,ORBS,MODE,spin,play};
})();

  /* ---------- one spin (already decided by the engine) ---------- */
  async function show(sp,b,paidBefore){
    listClear(); tumble(null);
    if(sp.kind!=='base'){ $('fsLeft').textContent=sp.left-(sp.award?5:0); msg(`FREE SPINS LEFT ${sp.left-(sp.award?5:0)}`); }
    await sleep(render(sp.steps[0].grid,null)+(fast()?0:150));
    let line=0;
    for(let i=1;i<sp.steps.length;i++){
      const st=sp.steps[i], prev=sp.steps[i-1].grid, key=v=>typeof v==='string'?v:'M';
      for(const w of st.wins){
        const cs=[]; for(let r=0;r<R;r++)for(let c=0;c<C;c++)if(key(prev[c][r])===w.s)cs.push(at(c,r));
        cs.forEach(e=>e.classList.add('hit'));
        const mid=cs[Math.floor(cs.length/2)], a=document.createElement('div'); a.className='amt'; a.textContent=money(w.pay*b); mid.appendChild(a);

  async function buyScatterDrop(b){
    const hasSuperScat=rnd()<0.04;
    // build a grid: regular symbols everywhere + exactly 4 scatters at random positions
    const g=OLY.spin(rnd,'base').steps[0].grid;
    // strip any scatters/orbs that landed naturally
    for(let c=0;c<C;c++)for(let r=0;r<R;r++){if(g[c][r]==='S'||g[c][r]==='Z'||typeof g[c][r]==='object')g[c][r]='blue';}
    // pick 4 random positions
    const allPos=[];for(let c=0;c<C;c++)for(let r=0;r<R;r++)allPos.push([c,r]);
    for(let i=allPos.length-1;i>0;i--){const j=Math.floor(rnd()*(i+1));[allPos[i],allPos[j]]=[allPos[j],allPos[i]];}
    const scatPos=allPos.slice(0,4);
    const superIdx=hasSuperScat?Math.floor(rnd()*4):-1;
    for(let i=0;i<scatPos.length;i++){const[sc,sr]=scatPos[i];g[sc][sr]=(i===superIdx)?'Z':'S';}
    // full board drop animation
    await sleep(render(g,null)+(fast()?0:200));
    // highlight scatters
    for(const[sc,sr]of scatPos)at(sc,sr).classList.add('hit');
    await sleep(fast()?200:700);
    if(hasSuperScat){
      const[sc,sr]=scatPos[superIdx];const sEl=at(sc,sr);
      sEl.classList.add('glow');bolt(pos(sEl));
      await sleep(fast()?180:600);
      credit(100*b);setWin(100*b);msg(`SUPER SCATTER! +${money(100*b)}`);
      await sleep(fast()?250:800);
      return 100*b;
    }
    return 0;
  }

  async function play(buy){
    if(busy||!$('ov').hidden)return;
    const b=bet();
    const cost=round2(buy==='super'?b*SBUY:buy?b*BUY:stake());
    bal=getBal();

    const _a=_API();if(_a){_a.bal=_a.round2(_a.bal-cost);_a.paintBal(-1);}
    bal=getBal(); paintBal();
    busy=true; skip=false; idle(false); sync(); setWin(0); msg('GOOD LUCK!');
    const res=OLY.play(rnd,{ante:!buy&&anteOn,buy});

      const superBonus=await buyScatterDrop(b);

      const superNote=superBonus>0?`SUPER SCATTER! +${money(superBonus)}`:'';
      const note=[buyNote,superNote].filter(Boolean).join(' · ');

    }
    const overLimit=buy&&cost>=2500;

    if(paidWin>0)credit(paidWin);
    setWin(paidWin); msg((paidWin>0)?'':'PLACE YOUR BETS!');

    if(auto)setTimeout(()=>{ if(auto&&!busy)play(null) },fast()?250:700);
  }

  $('anteTog').onclick=()=>{ if(busy)return; anteOn=!anteOn; sync(); };
  async function buyAsk(kind){
    if(busy||anteOn)return;
    const price=bet()*(kind==='super'?SBUY:BUY);
    const ok=await overlay(`<div class="stone" style="width:900px;height:560px"><div class="h blue">${kind==='super'?'BUY SUPER FREE SPINS':'BUY FREE SPINS'}</div>`+
      `<div class="p gold">${money(price)}</div><div class="okx"><button class="no" data-v="0">&#10007;</button><button class="yes" data-v="1">&#10003;</button></div></div>`,{click:false});
    if(ok)play(kind==='super'?'super':'fs');
  }
  $('buyBox').onclick=()=>buyAsk('fs');
  $('sbuyBox').onclick=()=>buyAsk('super');
  $('autoBtn').onclick=()=>{ auto=!auto; sync(); if(auto&&!busy)play(null); };
  $('turboBtn').onclick=()=>{ turbo=!turbo; try{localStorage.setItem('olyTurbo',turbo?'1':'0')}catch(_){} sync(); };
  addEventListener('keydown',e=>{
    if(e.code==='Escape'){ if(ovClose&&!ovRes)ovClose(); return; }
    if(e.code!=='Space')return; e.preventDefault();
    if(e.repeat){hold=true;return}
    if(ovRes){ovRes();return}
    if(!$('ov').hidden)return;
    if(busy)skip=true; else play(null);
  });
  addEventListener('keyup',e=>{ if(e.code==='Space')hold=false; });

  $('menuBtn').onclick=()=>{
    if(!$('ov').hidden)return;
    overlay(`<div class="pwrap"><button class="xbtn" title="Close">&times;</button><div class="stone scroll" style="width:760px"><h3 class="gold">SETTINGS</h3>`+
      `<div class="setrow"><span>QUICK SPIN</span><button id="stTurbo">${turbo?'ON':'OFF'}</button></div>`+
      `<div class="setrow"><span>AUTOPLAY</span><button id="stAuto">${auto?'ON':'OFF'}</button></div>`+
      `<div class="setrow"><span>PAYTABLE &amp; RULES</span><button id="stPay">OPEN</button></div></div><button class="closeBig">CLOSE</button></div>`,{click:false,outside:true});
    $('stTurbo').onclick=e=>{e.stopPropagation();$('turboBtn').click();$('stTurbo').textContent=turbo?'ON':'OFF'};
    $('stAuto').onclick=e=>{e.stopPropagation();auto=!auto;sync();$('stAuto').textContent=auto?'ON':'OFF'};
    $('stPay').onclick=e=>{e.stopPropagation();ovClose();setTimeout(()=>$('infoBtn').click(),0)};
  };
  $('infoBtn').onclick=()=>{
    if(!$('ov').hidden)return;
    const ic=k=>`<span class="ic">${SVG[k]}</span>`, sm=k=>`<span class="sm">${SVG[k]}</span>`;
    const rows=Object.keys(OLY.PAY).map(k=>`<tr><td>${ic(k)}</td>`+OLY.PAY[k].map(p=>`<td>${mx(p)}</td>`).join('')+'</tr>').join('');
    overlay(`<div class="pwrap"><button class="xbtn" title="Close">&times;</button><div class="stone scroll"><h3 class="gold">PAYTABLE</h3>`+
      `<table><tr><th></th><th>8&ndash;9</th><th>10&ndash;11</th><th>12&ndash;30</th></tr>${rows}</table>`+
      `<p>Pays are multiples of your bet: a win pays the multiplier &times; your bet.</p>`+
      `<h3 class="gold">TUMBLE FEATURE</h3><p>8 or more of a symbol anywhere on the screen pays. Winning symbols disappear, the rest fall down and new symbols drop in. It keeps going while new wins form.</p>`+
      `<h3 class="gold">MULTIPLIERS</h3><p>Multiplier orbs (2&times; to 500&times;) can land on any spin. When the tumbles end with a win, all orbs on screen are added together and the tumble win is multiplied by the total. The bigger the value, the rarer it is.</p>`+
      `<div class="orbrow">${OLY.ORBS.map(m=>`<span>${orbSvg(m)}</span>`).join('')}</div>`+
      `<h3 class="gold">FREE SPINS</h3><p>${sm('S')} 4 or more scatters award <b>15 free spins</b> and pay 3&times; / 5&times; / 100&times; for 4 / 5 / 6+. During free spins, every orb that hits on a winning spin is added to the <b>total multiplier</b>, which keeps growing for the whole feature. 3 or more scatters award 5 more free spins.</p>`+
      `<h3 class="gold">SUPER SCATTER</h3><p>${sm('Z')} counts as a scatter and only lands in the base game. If a free spins trigger includes super scatters it pays instead of the normal scatter pay: 1 &rarr; 100&times;, 2 &rarr; 500&times;, 3 &rarr; 5,000&times;, 4+ &rarr; 50,000&times;.</p>`+
      `<h3 class="gold">DOUBLE CHANCE &amp; BUYS</h3><p>Double Chance costs 1.5&times; the bet and makes free spins about 2.5&times; as likely. Buy Free Spins costs 100&times; the bet. Buy Super Free Spins costs 500&times; the bet and every orb in it is 10&times; or more. Buys are off while Double Chance is on.</p>`+
      `<p>Max win 50,000&times; the bet. Bets $0.20&ndash;$3,000. RTP 96.5% (simulated over tens of millions of rounds). Hold space for turbo spin.</p></div><button class="closeBig">CLOSE</button></div>`,{click:false,outside:true});
  };

  AUTO.olympus=cb=>{ const before=bal; play(null); const poll=setInterval(()=>{if(!busy){clearInterval(poll);cb(bal-before)}},250); };

  mode(false); setCoin(0); paintBal(); sync(); setWin(0);
  render(OLY.spin(Math.random,'base').steps[0].grid,null);
  idle(true);
})();
</script></body></html>
