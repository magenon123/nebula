<style>
#bonusEnv{position:absolute;inset:0;pointer-events:none;overflow:visible;--envPulse:1;contain:layout}
#bonusEnv .env{position:absolute;inset:-400px -1700px;--ox:1700px;--oy:400px;opacity:0;transition:opacity .8s ease;overflow:hidden}
#bonusEnv .env>svg,#bonusEnv .env>.fx{position:absolute;left:var(--ox);top:var(--oy);width:1600px;height:900px;overflow:visible}
#bonusEnv .env .bg{position:absolute;inset:0}
#bonusEnv[data-bonus="tin"] .envTin,#bonusEnv[data-bonus="fs"] .envFs,#bonusEnv[data-bonus="super"] .envSuper{opacity:1}
#bonusEnv svg{display:block}
#bonusEnv .rise{animation:beRise var(--d,9s) linear var(--dl,0s) infinite;transform-box:fill-box}
#bonusEnv .drift{animation:beDrift var(--d,14s) ease-in-out var(--dl,0s) infinite alternate}
#bonusEnv .sway{animation:beSway var(--d,6s) ease-in-out var(--dl,0s) infinite alternate;transform-box:fill-box;transform-origin:50% 0}
#bonusEnv .fall{animation:beFall var(--d,16s) linear var(--dl,0s) infinite}
#bonusEnv .tw{animation:beTw var(--d,3s) ease-in-out var(--dl,0s) infinite alternate}
#bonusEnv .wisp{animation:beWisp var(--d,8s) ease-out var(--dl,0s) infinite;transform-box:fill-box;transform-origin:50% 100%}
@keyframes beRise{0%{transform:translate(0,40px);opacity:0}12%{opacity:1}85%{opacity:.9}100%{transform:translate(var(--dx,20px),calc(-1 * var(--h,600px)));opacity:0}}
@keyframes beFall{0%{transform:translate(0,-80px) rotate(0);opacity:0}8%{opacity:1}92%{opacity:1}100%{transform:translate(var(--dx,120px),1020px) rotate(var(--r,300deg));opacity:0}}
@keyframes beDrift{from{transform:translateX(-30px)}to{transform:translateX(40px)}}
@keyframes beSway{from{transform:rotate(-2.2deg)}to{transform:rotate(2.2deg)}}
@keyframes beTw{from{opacity:.35}to{opacity:1}}
@keyframes beWisp{0%{transform:translateY(30px) scale(.7,.7);opacity:0}20%{opacity:.55}100%{transform:translateY(-170px) scale(1.5,1.2);opacity:0}}
/* TIN pulse ring */
#bonusEnv .envTin .ring{position:absolute;left:var(--ox);top:var(--oy);width:1600px;height:900px;pointer-events:none}
#bonusEnv .envTin .ring i{position:absolute;left:446px;top:154px;width:708px;height:580px;border-radius:30px;box-shadow:0 0 50px 8px rgba(255,120,40,.55),0 0 140px 30px rgba(220,60,20,.35),inset 0 0 60px rgba(255,150,50,.25);animation:beRing calc(3s / var(--envPulse,1)) ease-in-out infinite}
@keyframes beRing{0%,100%{opacity:.45;transform:scale(1)}50%{opacity:1;transform:scale(1.025)}}
#bonusEnv .envTin .glow{animation:beFurn calc(4s / var(--envPulse,1)) ease-in-out infinite alternate}
@keyframes beFurn{from{opacity:.88}to{opacity:1}}
#bonusEnv .envFs .shaft{animation:beShaft 9s ease-in-out infinite alternate}
@keyframes beShaft{from{opacity:.55}to{opacity:.95}}
#bonusEnv .envSuper .sun{animation:beSun 6s ease-in-out infinite alternate;transform-box:fill-box;transform-origin:50% 50%}
@keyframes beSun{from{transform:scale(1);opacity:.92}to{transform:scale(1.05);opacity:1}}
#bonusEnv .envSuper .rays{animation:beSpin 120s linear infinite;transform-box:fill-box;transform-origin:50% 50%}
@keyframes beSpin{to{transform:rotate(360deg)}}
/* R2.1 WIDE: the env continues sideways (2 static mirrored copies of its art, scaleX -1 at both stage edges) and up/down (edge-colour bands, the portrait gradients), so 21:9 / 32:9 / 16:10 / 4:3 / 5:4 windows show env art edge to edge */
#bonusEnv .env>svg.mir{width:1600px;height:900px;transform:scaleX(-1)}
#bonusEnv .env>svg.ml{left:calc(var(--ox) - 1600px)}#bonusEnv .env>svg.mr{left:calc(var(--ox) + 1600px)}
#bonusEnv .mir *{animation:none!important}#bonusEnv .mir .rise,#bonusEnv .mir .fall,#bonusEnv .mir .wisp{display:none}
#bonusEnv .env>svg.mt{top:calc(var(--oy) - 900px)}
#bonusEnv .env>svg.mb{top:calc(var(--oy) + 900px)}
#bonusEnv .env>svg.mt,#bonusEnv .env>svg.mb{left:var(--ox);transform:scaleY(-1)}
body.portrait #bonusEnv .mir{display:none}
body:not(.portrait) #bonusEnv .env::before,body:not(.portrait) #bonusEnv .env::after{content:"";position:absolute;left:0;right:0;background-repeat:no-repeat;background-size:1600px 100%;background-position:calc(var(--ox) - 1600px) 0,var(--ox) 0,calc(var(--ox) + 1600px) 0}
body:not(.portrait) #bonusEnv .env::before{top:0;height:var(--oy);background-image:var(--tgR),var(--tg),var(--tgR);background-color:var(--tf)}
body:not(.portrait) #bonusEnv .env::after{top:calc(var(--oy) + 900px);bottom:0;background-image:var(--bg2R),var(--bg2),var(--bg2R);background-color:var(--bf)}
/* portrait: the scene is zoomed and the viewport is taller than the 1600x900 stage, so each env bleeds 1100px above/below the stage and continues its edge colours (no blank band) */
body.portrait #bonusEnv{overflow:visible;contain:none}
body.portrait #bonusEnv .env{inset:-1100px -200px;--ox:200px;--oy:1100px;--ex:1100px;--ew:1600px;--tf:#090405;--bf:#1a0a04}
body.portrait #bonusEnv .env>svg,body.portrait #bonusEnv .env>.fx,body.portrait #bonusEnv .envTin .ring{top:1100px}
body.portrait #bonusEnv .env::before,body.portrait #bonusEnv .env::after{content:"";position:absolute;left:200px;width:1600px}
body.portrait #bonusEnv .env::before{top:0;height:1100px;background:linear-gradient(180deg,var(--tf),transparent 0),var(--tg)}
body.portrait #bonusEnv .env::after{top:2000px;bottom:0;background:linear-gradient(180deg,transparent,var(--bf) 75%),var(--bg2)}
#bonusEnv .envTin{--tg:linear-gradient(90deg,#090405,#0e0707 12%,#130809 25%,#1b0b0a 37%,#1c0c0b 50%,#1b0b0a 62%,#130809 75%,#0e0707 88%,#090505);--tgR:linear-gradient(270deg,#090405,#0e0707 12%,#130809 25%,#1b0b0a 37%,#1c0c0b 50%,#1b0b0a 62%,#130809 75%,#0e0707 88%,#090505);--bg2:linear-gradient(90deg,#2e0f05,#66290b 12%,#814415 25%,#995119 37%,#a55c1d 50%,#995119 62%,#804315 75%,#66290b 88%,#2f1006);--bg2R:linear-gradient(270deg,#2e0f05,#66290b 12%,#814415 25%,#995119 37%,#a55c1d 50%,#995119 62%,#804315 75%,#66290b 88%,#2f1006);--bf:#150805}
#bonusEnv .envFs{--tg:linear-gradient(90deg,#57624d,#659866 12%,#8ab6a9 25%,#afcabc 37%,#c4d4c4 50%,#b4ccc0 62%,#8ab6a9 75%,#76a398 88%,#57634f);--tgR:linear-gradient(270deg,#57624d,#659866 12%,#8ab6a9 25%,#afcabc 37%,#c4d4c4 50%,#b4ccc0 62%,#8ab6a9 75%,#76a398 88%,#57634f);--bg2:linear-gradient(90deg,#4b5743,#598d5f 12%,#458277 25%,#448579 37%,#85aea3 50%,#44857a 62%,#3f7e73 75%,#35736a 88%,#4c5945);--bg2R:linear-gradient(270deg,#4b5743,#598d5f 12%,#458277 25%,#448579 37%,#85aea3 50%,#44857a 62%,#3f7e73 75%,#35736a 88%,#4c5945);--bf:#2c5a52}
#bonusEnv .envSuper{--tg:linear-gradient(90deg,#280438,#2a073b 12%,#2e0d3d 25%,#321040 37%,#391442 50%,#321040 62%,#2e0c3d 75%,#2a083b 88%,#28063a);--tgR:linear-gradient(270deg,#280438,#2a073b 12%,#2e0d3d 25%,#321040 37%,#391442 50%,#321040 62%,#2e0c3d 75%,#2a083b 88%,#28063a);--bg2:linear-gradient(#290435,#290435);--bg2R:linear-gradient(#290435,#290435);--bf:#290435}
body.lite #bonusEnv *{animation:none!important}
@media (prefers-reduced-motion:reduce){#bonusEnv *{animation:none!important}#bonusEnv .env{transition-duration:.01s}}
</style>
