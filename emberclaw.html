<!doctype html>
<html lang="en"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no">
<title>EmberClaw: Molten Reforge</title>
<style>
*{box-sizing:border-box}
[hidden]{display:none!important}
html,body{margin:0;height:100%;overflow:hidden;background:#0b0605;color:#ffe9c4;font-family:Impact,'Arial Narrow Bold','Arial Black',sans-serif;user-select:none;-webkit-user-select:none}
button{font-family:inherit;cursor:pointer;color:inherit}
body{--heat:0}
#fx{position:fixed;inset:0;pointer-events:none;z-index:50}

/* ---------- living background ---------- */
#bg{position:fixed;inset:0;z-index:0;overflow:hidden;background:linear-gradient(180deg,#07040a 0%,#160806 55%,#2a0d05 100%)}
#bg .sky{position:absolute;inset:0;background:radial-gradient(60% 40% at 50% 0%,rgba(120,30,10,.35),transparent 70%),radial-gradient(40% 30% at 15% 20%,rgba(80,20,60,.25),transparent 70%),radial-gradient(40% 30% at 85% 25%,rgba(80,30,10,.25),transparent 70%)}
#bg .fog{position:absolute;left:-50%;width:200%;height:40%;bottom:12%;background:radial-gradient(40% 50% at 20% 50%,rgba(255,110,40,.10),transparent 70%),radial-gradient(35% 50% at 60% 55%,rgba(255,90,20,.09),transparent 70%),radial-gradient(30% 50% at 90% 50%,rgba(255,130,40,.08),transparent 70%);animation:fog 26s linear infinite}
#bg .fog.f2{bottom:28%;opacity:.7;animation-duration:38s;animation-direction:reverse}
@keyframes fog{to{transform:translateX(25%)}}
#bg .lava{position:absolute;left:0;right:0;bottom:0;height:34%;
  background:radial-gradient(60% 100% at 50% 100%,rgba(255,110,20,calc(.35 + var(--heat)*.04)),transparent 70%),linear-gradient(0deg,rgba(255,80,0,.4),transparent);animation:lavap 3.2s ease-in-out infinite}
@keyframes lavap{50%{opacity:.65;transform:scaleY(1.12)}}
#bg svg.mtn{position:absolute;left:0;bottom:0;width:100%;height:46%}
#bg .crack{animation:crack 2.4s ease-in-out infinite}
#bg .crack:nth-child(2n){animation-delay:.8s}#bg .crack:nth-child(3n){animation-delay:1.5s}
@keyframes crack{50%{opacity:.35}}
.ring{position:absolute;left:50%;top:50%;width:min(130vh,130vw);height:min(130vh,130vw);margin:calc(min(130vh,130vw)/-2) 0 0 calc(min(130vh,130vw)/-2);opacity:.22;animation:spin 90s linear infinite}
.ring.r2{width:min(100vh,100vw);height:min(100vh,100vw);margin:calc(min(100vh,100vw)/-2) 0 0 calc(min(100vh,100vw)/-2);animation-direction:reverse;animation-duration:60s;opacity:.18}
@keyframes spin{to{transform:rotate(360deg)}}
.torch{position:absolute;bottom:20%;width:26px;height:150px;z-index:1}
.torch.l{left:max(2vw,8px)}.torch.r{right:max(2vw,8px)}
.torch .pole{position:absolute;bottom:0;left:9px;width:8px;height:100px;background:linear-gradient(90deg,#1a0f0a,#4a2c18,#1a0f0a);border-radius:3px}
.torch .bowl{position:absolute;bottom:92px;left:2px;width:22px;height:14px;background:linear-gradient(#5a4638,#1a120d);border-radius:2px 2px 12px 12px}
.torch .fl{position:absolute;bottom:100px;left:-6px;width:38px;height:62px;border-radius:50% 50% 45% 45%/70% 70% 30% 30%;
  background:radial-gradient(50% 60% at 50% 75%,#fff6b0,#ffb020 45%,#e8420a 75%,transparent 100%);filter:blur(1.5px) drop-shadow(0 0 18px #ff6a00);transform-origin:50% 100%;animation:fl .6s ease-in-out infinite alternate}
.torch .fl.b{animation-duration:.45s;width:24px;left:1px;height:42px;opacity:.9}
@keyframes fl{0%{transform:scale(1,1) skewX(-3deg)}100%{transform:scale(.88,1.12) skewX(4deg)}}
.torch .halo{position:absolute;bottom:90px;left:-90px;width:206px;height:206px;border-radius:50%;background:radial-gradient(circle,rgba(255,120,30,.22),transparent 65%);animation:lavap 1.6s ease-in-out infinite}
@media(max-width:900px){.torch{display:none}}

#app{position:relative;z-index:2;height:100%;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:8px}
#app.shake{animation:shake .5s}
#app.shake2{animation:shake .9s}
@keyframes shake{10%,50%,90%{transform:translate(-4px,2px)}30%,70%{transform:translate(5px,-3px)}}
h1{margin:0;font-size:clamp(20px,4vw,34px);letter-spacing:3px;background:linear-gradient(#fff3b0,#ffb020 55%,#c03a00);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 2px 0 #000) drop-shadow(0 0 14px rgba(255,100,0,.5))}
#top{display:flex;gap:18px;align-items:center;font-size:clamp(14px,2.2vw,20px);letter-spacing:1px}
#top span{padding:3px 12px;background:rgba(0,0,0,.45);border:1px solid #5a3a22;border-radius:8px}
#top b{color:#ffd24a}
#stage{display:flex;gap:12px;align-items:stretch}

/* cracked-obsidian frame, rune inlay pulses with the core */
#frame{position:relative;padding:16px;border-radius:14px;
  background:
   linear-gradient(115deg,transparent 48%,rgba(255,120,30,.35) 49%,transparent 50.5%) 0 0/160px 160px,
   linear-gradient(65deg,transparent 60%,rgba(255,120,30,.25) 61%,transparent 62%) 0 0/200px 200px,
   linear-gradient(135deg,#2a2524,#0d0b0b 40%,#2c2625 70%,#0f0c0c);
  box-shadow:0 0 0 2px #000,0 0 calc(14px + var(--heat)*4px) rgba(255,100,20,calc(.25 + var(--heat)*.06)),inset 0 0 30px #000;
  border:2px solid #4a342a;animation:rune 2.2s ease-in-out infinite}
#frame::before{content:"";position:absolute;inset:4px;border-radius:11px;pointer-events:none;border:1px solid rgba(255,150,50,calc(.3 + var(--heat)*.06));box-shadow:0 0 8px rgba(255,120,30,.35) inset}
#frame i{position:absolute;width:14px;height:14px;background:radial-gradient(circle,#ffd24a,#b8741a 60%,#3a1a08);border-radius:50%;box-shadow:0 0 8px #f80}
#frame i:nth-child(1){left:-6px;top:-6px}#frame i:nth-child(2){right:-6px;top:-6px}#frame i:nth-child(3){left:-6px;bottom:-6px}#frame i:nth-child(4){right:-6px;bottom:-6px}
@keyframes rune{50%{box-shadow:0 0 0 2px #000,0 0 calc(28px + var(--heat)*5px) rgba(255,110,20,.6),inset 0 0 30px #000}}
#grid{position:relative;overflow:hidden;display:grid;grid-template-columns:repeat(6,minmax(0,1fr));grid-template-rows:repeat(5,minmax(0,1fr));gap:5px;width:min(72vw,calc((100vh - 280px)*1.2),620px);aspect-ratio:6/5;
  background:radial-gradient(80% 80% at 50% 100%,#3a1408,#0e0807);border-radius:8px;padding:5px;box-shadow:inset 0 0 24px #000}

.cell{position:relative;min-width:0;min-height:0;display:flex;align-items:center;justify-content:center;border-radius:10px;overflow:visible;
  border:1px solid #4b4452;background:linear-gradient(160deg,#3a343c,#17141a);box-shadow:inset 0 1px 0 rgba(255,255,255,.12),inset 0 -6px 10px rgba(0,0,0,.45),0 2px 4px rgba(0,0,0,.5)}
.cell::before{content:"";position:absolute;inset:0;border-radius:9px;pointer-events:none;background:linear-gradient(135deg,rgba(255,255,255,.14),transparent 42%)}
.cell.t-mid{border-color:#8a5a2a;background:linear-gradient(160deg,#573019,#1c0e08)}
.cell.t-high{border-color:#e0a82a;background:linear-gradient(160deg,#6a4707,#1e1402);box-shadow:inset 0 1px 0 rgba(255,230,150,.4),inset 0 -6px 10px rgba(0,0,0,.45),0 0 10px rgba(255,170,30,.35)}
.cell.wild{border-color:#ffd24a;background:radial-gradient(circle,#ff8a1a,#7a1500 75%);box-shadow:0 0 20px #ff6a00,inset 0 0 14px rgba(255,220,100,.6)}
.cell.scatter{border-color:#ff7ab0;background:radial-gradient(circle,#ff5a9a,#4a0830 75%);box-shadow:0 0 16px #ff3a8a}
.cell svg.g{position:absolute;left:11%;top:11%;width:78%;height:78%;filter:drop-shadow(0 3px 2px rgba(0,0,0,.65))}
.cell.wild svg.g{animation:wob 1.4s ease-in-out infinite alternate;filter:drop-shadow(0 0 8px #ff9a00)}
.cell.scatter svg.g{animation:wob 1.8s ease-in-out infinite alternate;filter:drop-shadow(0 0 8px #ff4a9a)}
@keyframes wob{to{transform:scale(1.1) rotate(4deg)}}
.cell .m{position:absolute;right:3px;bottom:1px;font-size:15px;color:#fff;text-shadow:0 0 4px #000,0 0 8px #f60;z-index:3}
.cell.hit{animation:hit .5s ease-in-out infinite alternate;z-index:2}
@keyframes hit{from{box-shadow:0 0 0 2px #ffb020,0 0 10px #ff7a00}to{box-shadow:0 0 0 3px #fff2a0,0 0 26px #ff9a00;transform:scale(1.07)}}
.cell.shatter{animation:shatter .32s forwards}
@keyframes shatter{to{transform:scale(1.3) rotate(8deg);opacity:0;filter:brightness(2) contrast(2)}}
/* symbols fall in from above, bottom row lands first, then each row above it */
.cell.drop{animation:drop .55s cubic-bezier(.3,1.25,.5,1) backwards;animation-delay:var(--dl,0ms)}
@keyframes drop{from{transform:translateY(-420%);opacity:0}25%{opacity:1}}
.cell.out{animation:out .42s cubic-bezier(.6,0,1,.6) forwards;animation-delay:var(--dl,0ms)}
@keyframes out{to{transform:translateY(420%);opacity:0}}
.cell.reforged{animation:refo .9s}
@keyframes refo{0%{filter:brightness(4);transform:scale(.4) rotate(-90deg)}60%{filter:brightness(2);transform:scale(1.25)}}

/* forge core: glass tube of lava */
#core{width:50px;display:flex;flex-direction:column;align-items:center;gap:4px}
#tube{flex:1;width:100%;border-radius:25px;border:3px solid #7a6a62;background:linear-gradient(90deg,#1b1514,#2c2321 40%,#120d0c);
  display:flex;flex-direction:column-reverse;gap:3px;padding:5px;box-shadow:inset 0 0 12px #000,0 0 14px rgba(255,100,0,calc(var(--heat)*.07))}
#tube i{flex:1;border-radius:6px;background:#241a18;transition:all .35s}
#tube i.on{background:linear-gradient(#ffd24a,#ff5a00 70%,#a01800);box-shadow:0 0 calc(4px + var(--lvl)*2px) #ff7a00}
#tube i.on.k3,#tube i.on.k6,#tube i.on.k9{box-shadow:0 0 14px #fff2a0}
#heatNum{font-size:20px;color:#ffb020;text-shadow:0 0 8px #f60}
#coreLbl{font-size:10px;letter-spacing:2px;color:#a88}
#side{display:flex;flex-direction:column;justify-content:center;gap:8px;width:132px}
#msg{min-height:30px;font-size:clamp(14px,2.4vw,22px);color:#ffd24a;text-align:center;text-shadow:0 0 10px #f60}
#bar{display:flex;gap:10px;align-items:center;flex-wrap:wrap;justify-content:center}
.btn{background:linear-gradient(#5a2a10,#2a1008);border:2px solid #b8741a;border-radius:10px;padding:8px 14px;font-size:16px;letter-spacing:1px;box-shadow:0 3px 0 #1a0804}
.btn:hover:not(:disabled){filter:brightness(1.25)}.btn:disabled{opacity:.45;cursor:not-allowed}
#spin{font-size:26px;padding:10px 34px;background:linear-gradient(#ff8a1a,#b32a00);border-color:#ffd24a;box-shadow:0 0 18px #f60,0 3px 0 #5a1400}
#ante.on{background:linear-gradient(#ffd24a,#b86a00);color:#2a1000}
.small{font-size:12px;padding:5px 8px}
#bar>span{padding:3px 10px;background:rgba(0,0,0,.45);border:1px solid #5a3a22;border-radius:8px}
#big{position:fixed;inset:0;z-index:60;display:flex;flex-direction:column;align-items:center;justify-content:center;background:rgba(0,0,0,.72);pointer-events:none;opacity:0;transition:opacity .3s}
#big.show{opacity:1;pointer-events:auto}
#bigT{font-size:clamp(40px,10vw,110px);letter-spacing:6px;background:linear-gradient(#fff,#ffb020 50%,#c02000);-webkit-background-clip:text;background-clip:text;color:transparent;filter:drop-shadow(0 0 20px #f60)}
#bigA{font-size:clamp(26px,6vw,64px);color:#ffd24a}
#auth{position:fixed;inset:0;z-index:70;background:#0b0605;display:flex;align-items:center;justify-content:center;text-align:center}

/* buy-bonus confirmation */
#confirm{position:fixed;inset:0;z-index:80;background:rgba(0,0,0,.72);display:flex;align-items:center;justify-content:center;backdrop-filter:blur(2px)}
#confirm .mbox{width:min(92vw,380px);padding:22px 22px 18px;border-radius:14px;text-align:center;border:2px solid #b8741a;
  background:linear-gradient(160deg,#2a1710,#0f0907);box-shadow:0 0 40px rgba(255,100,20,.45),inset 0 0 24px #000;animation:pop .22s ease-out}
@keyframes pop{from{transform:scale(.85);opacity:0}}
#confirm h2{margin:0 0 6px;font-size:26px;letter-spacing:2px;color:#ffd24a;text-shadow:0 0 12px #f60}
#confirm p{margin:6px 0;font-size:15px;color:#e8cfa8;font-family:Arial,sans-serif;line-height:1.4}
#confirm .cost{margin:12px 0;font-size:30px;color:#fff}
#confirm .cost small{display:block;font-size:12px;color:#a88;letter-spacing:1px}
#confirm .btns{display:flex;gap:10px;justify-content:center;margin-top:10px}
#confirm .btn{flex:1;font-size:18px;padding:10px}
#cYes{background:linear-gradient(#ff8a1a,#b32a00);border-color:#ffd24a}
#cWarn{color:#ff7a6a;min-height:18px;font-size:13px}
@media(max-width:560px){#stage{flex-direction:column;align-items:center}#core{width:100%;height:34px;flex-direction:row}#tube{flex-direction:row;border-radius:17px}#side{width:auto;flex-direction:row}}
</style></head><body>

 <symbol id="s6" viewBox="0 0 64 64"><!-- crown of cinders -->
  <path d="M8 47 L6 17 L21 31 L32 10 L43 31 L58 17 L56 47Z" fill="url(#gGold)" stroke="#6a3a00" stroke-width="2.5" stroke-linejoin="round"/>

 <symbol id="s7" viewBox="0 0 64 64"><!-- ember core sigil (wild) -->
  <circle cx="32" cy="34" r="25" fill="none" stroke="#ffd24a" stroke-width="2.5" stroke-dasharray="3 3.2" opacity=".9"/>

<!-- atmosphere -->
<div id="bg">
  <div class="sky"></div>
  <svg class="ring" viewBox="0 0 200 200"><g fill="none" stroke="#ff8a2a" stroke-width=".5"><circle cx="100" cy="100" r="98"/><circle cx="100" cy="100" r="88" stroke-dasharray="2 3"/><circle cx="100" cy="100" r="70"/><path d="M100 2 L172 150 L28 150Z"/><path d="M100 198 L28 50 L172 50Z"/></g><g fill="#ff8a2a" font-size="9" text-anchor="middle" font-family="serif" id="runes"></g></svg>
  <svg class="ring r2" viewBox="0 0 200 200" style="animation-direction:reverse"><g fill="none" stroke="#ffb040" stroke-width=".6"><circle cx="100" cy="100" r="95" stroke-dasharray="6 4"/><circle cx="100" cy="100" r="60"/></g></svg>
  <div class="fog"></div><div class="fog f2"></div>
  <div class="lava"></div>
  <svg class="mtn" viewBox="0 0 1200 400" preserveAspectRatio="none">
    <defs><linearGradient id="mg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#1a0a08"/><stop offset="1" stop-color="#050202"/></linearGradient></defs>
    <path d="M0 400 V250 L90 200 L170 260 L270 150 L330 190 L420 90 L470 120 L520 60 L560 40 L610 70 L650 55 L700 110 L780 80 L850 170 L930 120 L1010 210 L1100 160 L1200 240 V400Z" fill="url(#mg)"/>
    <g stroke="#ff7a1a" stroke-width="3" fill="none" stroke-linecap="round" stroke-linejoin="round" filter="url(#fGlow)">
      <path class="crack" d="M560 42 L548 120 L575 190 L552 300"/><path class="crack" d="M610 72 L630 150 L605 240"/>
      <path class="crack" d="M420 92 L400 170 L430 260"/><path class="crack" d="M780 82 L800 160 L770 250"/><path class="crack" d="M270 152 L250 230"/><path class="crack" d="M930 122 L950 210"/></g>
  </svg>
  <div class="torch l"><div class="halo"></div><div class="pole"></div><div class="bowl"></div><div class="fl"></div><div class="fl b"></div></div>
  <div class="torch r"><div class="halo"></div><div class="pole"></div><div class="bowl"></div><div class="fl"></div><div class="fl b"></div></div>
</div>
<canvas id="fx"></canvas>
<div id="auth" hidden><div><h1>EMBERCLAW</h1><p>Sign in to Nebula first, then reopen this game.</p></div></div>
<div id="app">
  <h1>EMBERCLAW &middot; MOLTEN REFORGE</h1>
  <div id="top"><span>Balance <b id="bal">–</b></span><span>Win <b id="win">0.00</b></span><span id="fsBox" hidden>Free spins <b id="fs">0</b></span></div>
  <div id="stage">
    <div id="frame"><i></i><i></i><i></i><i></i><div id="grid"></div></div>
    <div id="core"><div id="coreLbl">CORE</div><div id="tube"></div><div id="heatNum">0</div></div>
    <div id="side">
      <button class="btn small" id="buy1">BUY BONUS<br>100x</button>
      <button class="btn small" id="buy2">PRE-HEATED<br>500x</button>
      <button class="btn small" id="ante">ANTE +25%</button>
    </div>
  </div>
  <div id="msg">Strike the anvil.</div>
  <div id="bar">
    <button class="btn" id="m">−</button><span>Bet <b id="bet">1.00</b></span><button class="btn" id="p">+</button>
    <button class="btn" id="spin">SPIN</button>
  </div>
</div>
<div id="big"><div id="bigT"></div><div id="bigA"></div></div>
<div id="confirm" hidden><div class="mbox">
  <h2 id="cTitle"></h2><p id="cDesc"></p>
  <div class="cost"><small>COST</small><span id="cCost"></span></div>
  <div id="cWarn"></div>
  <div class="btns"><button class="btn" id="cNo">CANCEL</button><button class="btn" id="cYes">CONFIRM</button></div>
</div></div>
<script>
'use strict';
/* Pure renderer: the server returns the whole cascade sequence; nothing here computes an outcome. */
const $ = id => document.getElementById(id);
const API = location.origin.startsWith('http') ? '' : 'http://localhost:3000';
const TOKEN = localStorage.getItem('stakeToken');
const TIER = ['low','low','low','mid','mid','high','high','wild','scatter'];
const BETS = [0.1,0.2,0.5,1,2,5,10,20,50,100,200,500];
let bi = 3, ante = false, busy = false, balance = 0, lastGrid = null, lastWilds = [];
const sleep = ms => new Promise(r => setTimeout(r, ms));
const fmt = n => Number(n).toFixed(2);
$('runes').innerHTML = 'ᚠᚢᚦᚨᚱᚲᚷᚹᚺᚾᛁᛃᛇᛈᛉᛊ'.split('').map((g, i) => `<text transform="rotate(${i * 22.5} 100 100)" x="100" y="16">${g}</text>`).join('');

const cells = [];
for (let i = 0; i < 30; i++) { const d = document.createElement('div'); d.className = 'cell'; $('grid').append(d); cells.push(d); }
const at = (r, c) => cells[r * 6 + c];
function paint(grid, wilds = []) {
  lastGrid = grid; lastWilds = wilds;
  const wm = {}; wilds.forEach(w => wm[w.r * 6 + w.c] = w.mult);
  grid.forEach((row, r) => row.forEach((s, c) => {
    const d = at(r, c); d.className = 'cell t-' + TIER[s] + (s === 7 ? ' wild' : s === 8 ? ' scatter' : ''); d.style.removeProperty('--dl');
    d.innerHTML = `<svg class="g"><use href="#s${s}"/></svg>` + (s === 7 && wm[r * 6 + c] > 1 ? `<span class="m">x${wm[r * 6 + c]}</span>` : '');
  }));
}
/* bottom row lands first, every row above follows */
const dropCell = (d, r) => { d.style.setProperty('--dl', (4 - r) * 95 + 'ms'); d.classList.add('drop'); };
function dropAll() { for (let r = 0; r < 5; r++) for (let c = 0; c < 6; c++) dropCell(at(r, c), r); }
async function dropOut() {
  for (let r = 0; r < 5; r++) for (let c = 0; c < 6; c++) { const d = at(r, c); d.classList.remove('drop'); d.style.setProperty('--dl', (4 - r) * 55 + 'ms'); d.classList.add('out'); }
  await sleep(4 * 55 + 430);
}
const tube = $('tube');
for (let i = 1; i <= 9; i++) { const e = document.createElement('i'); e.dataset.n = i; if (i % 3 === 0) e.classList.add('k' + i); tube.append(e); }
let heatNow = 0;
function setHeat(h) {
  heatNow = h; const lit = Math.min(h, 9);
  [...tube.children].forEach(e => { const on = +e.dataset.n <= lit; e.classList.toggle('on', on); e.style.setProperty('--lvl', e.dataset.n); });
  $('heatNum').textContent = h; document.body.style.setProperty('--heat', Math.min(h, 12));
}

/* hammer-strike sound */
let ac; function thump(f = 90, g = .5) {
  try { ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    const o = ac.createOscillator(), a = ac.createGain(); o.type = 'triangle'; o.frequency.setValueAtTime(f * 2, ac.currentTime);
    o.frequency.exponentialRampToValueAtTime(f, ac.currentTime + .12); a.gain.setValueAtTime(g, ac.currentTime);
    a.gain.exponentialRampToValueAtTime(.001, ac.currentTime + .35); o.connect(a).connect(ac.destination); o.start(); o.stop(ac.currentTime + .36); } catch {}
}

/* ember particles: bursts on wins + a constant drift of ambient embers that gets denser with Core heat */
const cv = $('fx'), cx = cv.getContext('2d'); let parts = [];
function size() { cv.width = innerWidth; cv.height = innerHeight; } size(); addEventListener('resize', size);
function embers(n, x = innerWidth / 2, y = innerHeight / 2) {
  for (let i = 0; i < n; i++) parts.push({ x, y, vx: (Math.random() - .5) * 8, vy: -Math.random() * 7 - 1, l: 60 + Math.random() * 60, s: 1 + Math.random() * 3, g: .12 });
}
function ambient() {
  if (parts.length > 400) return;
  const n = Math.random() < .35 + heatNow * .08 ? 1 : 0;
  for (let i = 0; i < n; i++) parts.push({ x: Math.random() * innerWidth, y: innerHeight + 6, vx: (Math.random() - .5) * .8, vy: -(.6 + Math.random() * 1.6), l: 240 + Math.random() * 200, s: .8 + Math.random() * 2.2, g: -.002, w: Math.random() * 6 });
}
(function loop() {
  cx.clearRect(0, 0, cv.width, cv.height); ambient();
  parts = parts.filter(p => p.l-- > 0 && p.y > -20);
  for (const p of parts) {
    p.x += p.vx + (p.w ? Math.sin((p.l + p.w * 40) / 25) * .5 : 0); p.y += p.vy; p.vy += p.g;
    const a = Math.min(1, p.l / 70); cx.fillStyle = `rgba(255,${100 + Math.min(120, p.l)}, 20, ${a})`; cx.shadowColor = '#ff7a00'; cx.shadowBlur = 6; cx.fillRect(p.x, p.y, p.s, p.s);
  }
  requestAnimationFrame(loop);
})();
const shake = (big) => { const a = $('app'); a.classList.remove('shake', 'shake2'); void a.offsetWidth; a.classList.add(big ? 'shake2' : 'shake'); };
const say = t => $('msg').textContent = t;

async function api(body) {
  const r = await fetch(API + '/api/emberclaw/spin', { method: 'POST', headers: { 'content-type': 'application/json', authorization: 'Bearer ' + TOKEN }, body: JSON.stringify(body) });
  const j = await r.json(); if (!r.ok) throw new Error(j.error || 'Spin failed'); return j;
}

async function playEvents(events) {
  for (const e of events || []) {
    if (e.type === 'detonate') { say(e.forced ? 'GUARANTEED DETONATION!' : 'CORE DETONATES — wilds x2!'); shake(true); thump(55, .8); embers(120); }
    else if (e.type === 'reforge') { say('The Core reforges a Wild!'); thump(70, .6); }
    for (const c of e.cells || []) { const d = at(c.r, c.c); d.classList.add('reforged'); }
    await sleep(700);
  }
}

/* step through one spin's cascade sequence; returns nothing, updates UI */
async function playSpin(sp, runningFrom, stake) {
  paint(sp.initialGrid); dropAll(); thump(80, .5); await sleep(1000); thump(60, .4);
  if (sp.openingGrid) {
    if (sp.openingEvents && sp.openingEvents.length) { paint(sp.openingGrid, sp.openingWilds); await playEvents(sp.openingEvents); }
  }
  setHeat(sp.startHeat || 0);
  let run = runningFrom;
  for (const st of sp.cascadeSteps) {
    st.clusters.forEach(k => k.cells.forEach(c => at(c.r, c.c).classList.add('hit')));
    say(`Cluster x${st.clusters.length}  +${fmt(st.payout * stake)}`); thump(100, .4); await sleep(650);
    st.clearedCells.forEach(c => at(c.r, c.c).classList.add('shatter')); await sleep(330);
    run += st.payout * stake; $('win').textContent = fmt(run);
    paint(st.grid, st.wilds);
    st.newCells.forEach(c => dropCell(at(c.r, c.c), c.r)); setHeat(st.coreHeat); embers(10, innerWidth / 2, innerHeight / 2);
    await sleep(700);
    await playEvents(st.reforgeEvents);
    if (st.reforgeEvents && st.reforgeEvents.length) paint(st.grid, st.wilds);
  }
  return run;
}

function tierOf(x) { return x >= 100 ? 'LEGENDARY' : x >= 25 ? 'FORGED' : x >= 10 ? 'MOLTEN' : x >= 5 ? 'SPARK' : null; }
async function bigWin(x, amt) {
  const t = tierOf(x); if (!t) return;
  const lv = { SPARK: 1, MOLTEN: 2, FORGED: 3, LEGENDARY: 4 }[t];
  $('bigT').textContent = t + ' WIN'; $('bigA').textContent = fmt(amt) + ' (' + x.toFixed(1) + 'x)';
  $('big').classList.add('show'); shake(lv > 2); embers(40 * lv * lv);
  for (let i = 0; i < lv; i++) { thump(60 + i * 10, .7); await sleep(300); embers(60 * lv); }
  await sleep(1400 + lv * 600); $('big').classList.remove('show');
}

async function go(buy) {
  if (busy) return; busy = true; document.querySelectorAll('#app button').forEach(b => b.disabled = true);
  $('win').textContent = '0.00'; $('fsBox').hidden = true;
  const stake = BETS[bi];
  try {
    setHeat(0);
    let j;
    try { [j] = await Promise.all([api({ stake, ante: buy ? false : ante, buy }), dropOut()]); }
    catch (e) { if (lastGrid) paint(lastGrid, lastWilds); throw e; }
    const R = j.round; let run = 0;
    balance = j.user.balance - j.payout;  // show the stake leaving now, the win as it lands
    $('bal').textContent = fmt(balance);
    if (!R.bought) { run = await playSpin({ initialGrid: R.initialGrid, openingGrid: R.openingGrid, openingEvents: R.openingEvents, openingWilds: [], cascadeSteps: R.cascadeSteps, startHeat: 0 }, 0, stake); }
    if (R.bonusTriggered) {
      say(`THE REFORGING — ${R.freeSpinsAwarded} free spins!`); thump(50, .9); shake(true); embers(200); await sleep(1500);
      $('fsBox').hidden = false;
      let first = true;
      for (const sp of R.bonus.spins) {
        $('fs').textContent = sp.spinsLeft; say(`Free spin ${sp.spinIndex}` + (sp.retrigger ? `  +${sp.retrigger} SPINS!` : ''));
        if (!first || !R.bought) await dropOut();
        first = false;
        run = await playSpin(sp, run, stake); await sleep(300);
      }
      $('fsBox').hidden = true;
    }
    $('win').textContent = fmt(j.payout); balance = j.user.balance; $('bal').textContent = fmt(balance); syncParent(j.user);
    say(j.payout > 0 ? `You forged ${fmt(j.payout)}` : 'Cold iron. Strike again.');
    await bigWin(R.totalPayout, j.payout);
  } catch (e) { say(e.message); }
  busy = false; document.querySelectorAll('#app button').forEach(b => b.disabled = false); refreshUi();
}

/* buy-bonus confirmation popup */
const BUYS = {
  standard: { title: 'BUY BONUS', mult: 100, desc: 'Skip straight to The Reforging: 10 free spins where the Forge Core heat carries over between spins.' },
  preheated: { title: 'PRE-HEATED BONUS', mult: 500, desc: 'The Reforging with the Forge Core already at 6 heat — you start with a reforged Wild and the Core primed.' }
};
let pendingBuy = null;
function askBuy(kind) {
  if (busy) return; const b = BUYS[kind], cost = BETS[bi] * b.mult; pendingBuy = kind;
  $('cTitle').textContent = b.title; $('cDesc').textContent = b.desc; $('cCost').textContent = fmt(cost) + '  (' + b.mult + 'x bet ' + fmt(BETS[bi]) + ')';
  const short = cost > balance + 1e-9; $('cWarn').textContent = short ? 'Not enough balance.' : ''; $('cYes').disabled = short;
  $('confirm').hidden = false;
}
function closeBuy(ok) { const k = pendingBuy; pendingBuy = null; $('confirm').hidden = true; if (ok && k) go(k); }
$('cYes').onclick = () => closeBuy(true);
$('cNo').onclick = () => closeBuy(false);
$('confirm').addEventListener('click', e => { if (e.target === $('confirm')) closeBuy(false); });

function syncParent(u) { try { const a = parent !== window && parent._slotAPI; if (a) { a.bal = u.balance; a.paintBal(0); } } catch {} }
function refreshUi() {
  const s = BETS[bi]; $('bet').textContent = fmt(s);
  $('buy1').innerHTML = `BUY BONUS<br>${fmt(s * 100)}`; $('buy2').innerHTML = `PRE-HEATED<br>${fmt(s * 500)}`;
  $('ante').classList.toggle('on', ante); $('ante').innerHTML = ante ? `ANTE ON<br>${fmt(s * 1.25)}` : 'ANTE +25%';
}
$('m').onclick = () => { bi = Math.max(0, bi - 1); refreshUi(); };
$('p').onclick = () => { bi = Math.min(BETS.length - 1, bi + 1); refreshUi(); };
$('ante').onclick = () => { ante = !ante; refreshUi(); };
$('spin').onclick = () => go(null);
$('buy1').onclick = () => askBuy('standard');
$('buy2').onclick = () => askBuy('preheated');
addEventListener('keydown', e => {
  if (!$('confirm').hidden) { if (e.code === 'Escape') closeBuy(false); return; }
  if (e.code === 'Space') { e.preventDefault(); go(null); }
});

paint(Array.from({ length: 5 }, (_, r) => Array.from({ length: 6 }, (_, c) => (r * 2 + c) % 7))); dropAll();
refreshUi();
if (!TOKEN) $('auth').hidden = false;
else fetch(API + '/api/me', { headers: { authorization: 'Bearer ' + TOKEN } }).then(r => r.json())
  .then(j => { if (j.user) { balance = j.user.balance; $('bal').textContent = fmt(balance); } else $('auth').hidden = false; });
</script></body></html>
